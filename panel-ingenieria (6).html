<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elmufdi Construcciones — Panel de Ingeniería</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#fff;--card:#fff;--border:#C5D0E0;--border2:#DDE5EF;
  --blue:#1E3A6E;--blue-lt:#2B5298;--blue-bg:#EBF0F8;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --muted:#6B7280;--muted2:#9CA3AF;--muted3:#E5E7EB;
  --text:#111827;--text2:#374151;--text3:#6B7280;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --mono:'Courier New',Courier,monospace;
  --r:10px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
/* ── Header ── */
#hdr{background:#1E3A6E;border-bottom:1px solid #162d57;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(30,58,110,.4)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:36px;height:36px;background:linear-gradient(135deg,#1D4ED8,#60A5FA);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 2px 8px #2563EB40;flex-shrink:0}
.logo-tx{font-weight:800;font-size:13px;letter-spacing:.3px;color:#FFFFFF}
.logo-sb{color:#A8BFDE;font-size:8px;font-family:var(--mono);letter-spacing:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ── Alert bar ── */
#abar{display:none;background:#FEF2F2;border-bottom:2px solid #FECACA;padding:6px 20px;gap:8px;flex-wrap:wrap;align-items:center}
#abar.show{display:flex}
.aitem{background:#FEE2E2;border:1px solid #FECACA;border-radius:5px;padding:3px 9px;font-size:11px;font-family:var(--mono);color:var(--red)}
/* ── Nav ── */
#nav{display:flex;gap:2px;padding:4px 20px;background:#F4F7FC;border-bottom:2px solid #1E3A6E;overflow-x:auto;flex-shrink:0}
.nb{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;white-space:nowrap;transition:all .15s}
.nb.active{color:#1E3A6E;font-weight:700;border-bottom-color:#1E3A6E;background:#EBF0F8}
.nb:hover:not(.active){background:#EBF0F8;color:#1E3A6E}
.nb .badge-dot{width:7px;height:7px;background:#DC2626;border-radius:50%;margin-left:2px;display:none}
.nb .badge-dot.show{display:inline-block}
/* ── Main ── */
#main{padding:20px;max-width:1160px;margin:0 auto}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card:hover{box-shadow:var(--sh2)}
/* ── Grids ── */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
/* ── KPI ── */
.kpi{text-align:center;padding:18px 10px}
.kpi-ic{font-size:22px;margin-bottom:6px}
.kpi-v{font-size:28px;font-weight:900;font-family:var(--mono)}
.kpi-l{font-size:9px;font-family:var(--mono);margin-top:3px;letter-spacing:.5px}
/* ── Bar ── */
.bw{background:var(--muted3);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;transition:width .5s ease}
/* ── Badge ── */
.bdg{border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap;display:inline-block}
/* ── Avatar ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--mono);flex-shrink:0}
/* ── Section headers ── */
.ey{color:#1E3A6E;font-family:var(--mono);font-size:9px;letter-spacing:3px;margin-bottom:3px;font-weight:700}
.st{font-size:20px;font-weight:800;margin-bottom:18px;color:var(--text)}
/* ── Row ── */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ── Stars ── */
.star{font-size:14px}.star.on{color:#F59E0B}.star.off{color:#D1D5DB}
/* ── Buttons ── */
.bp{background:linear-gradient(135deg,#1E3A6E,#2B5298);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;transition:all .15s;box-shadow:0 2px 6px rgba(30,58,110,.3);white-space:nowrap}
.bp:hover{opacity:.9;box-shadow:0 4px 12px rgba(30,58,110,.4)}
.bs{background:#fff;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .15s;box-shadow:var(--sh);white-space:nowrap}
.bs:hover{border-color:#1E3A6E;color:#1E3A6E;background:#EBF0F8}
.bd{background:var(--red-bg);border:1px solid #FECACA;color:var(--red);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);white-space:nowrap}
.bd:hover{background:#FEE2E2}
.bg2{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-size:11px;font-family:var(--mono);font-weight:700}
/* ── Week tabs ── */
.wt{padding:4px 11px;border-radius:6px;border:1px solid #2B5298;background:rgba(255,255,255,.1);color:#A8BFDE;cursor:pointer;font-size:10px;font-family:var(--mono);font-weight:700;transition:all .15s;white-space:nowrap}
.wt.active{border-color:#fff;background:rgba(255,255,255,.2);color:#fff}
/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mo.open{display:flex}
.mb{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{color:#1E3A6E;font-weight:800;font-size:15px}
.mc{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:2px 6px;border-radius:5px}
.mc:hover{background:var(--bg)}
/* ── Form ── */
.fi{margin-bottom:12px}
.fi label{color:var(--text2);font-size:11px;font-family:var(--mono);display:block;margin-bottom:4px;font-weight:700}
.fi input,.fi select,.fi textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-size:12px;font-family:var(--mono);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:#1E3A6E}
.fi textarea{resize:vertical;min-height:65px}
.fi input[type=range]{padding:4px 0;cursor:pointer}
/* ── Color picker ── */
.cprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.co{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.co.sel{border-color:#111;transform:scale(1.2)}
/* ── Status select inline ── */
select.ss{border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;border-width:1.5px;border-style:solid}
/* ── Historial ── */
.hi{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2);align-items:flex-start}
.hd{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* ── Comments ── */
.ci{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:7px}
.cm{color:var(--muted2);font-size:9px;font-family:var(--mono);margin-bottom:3px}
/* ── Charts ── */
.cbh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cl{font-size:10px;font-family:var(--mono);color:var(--text3);width:130px;flex-shrink:0;text-align:right}
.ct{flex:1;background:var(--muted3);border-radius:99px;height:18px;overflow:hidden}
.cf{height:100%;border-radius:99px;transition:width .6s ease;display:flex;align-items:center;padding-left:7px;min-width:20px}
.cv{font-size:9px;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 18px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;box-shadow:var(--sh2)}
#toast.show{opacity:1}
/* ── Inline edit ── */
.ie{border:none;background:transparent;font-size:inherit;font-weight:inherit;color:inherit;font-family:inherit;cursor:pointer;padding:2px 4px;border-radius:4px;outline:none;width:100%}
.ie:hover{background:var(--blue-bg)}
.ie:focus{background:var(--blue-bg);border-bottom:2px solid var(--blue)}
/* ── Rec banner ── */
.rb{margin-top:10px;background:var(--amber-bg);border:1px solid #FDE68A;border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:7px;color:var(--amber);font-size:11px;font-weight:600}
/* ── Divider ── */
.div{border:none;border-top:1px solid var(--border2);margin:12px 0}
/* ── Misc ── */
.mono{font-family:var(--mono)}.mu{color:var(--muted)}.sm{font-size:11px}.xs{font-size:10px}.bo{font-weight:700}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
/* ── Empty state ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-ic{font-size:40px;margin-bottom:10px}
/* ── Print ── */
@media print{
  #hdr,#nav,#abar,.np,.mo,#main{display:none!important}
  #reportContainer{display:block!important}
  body{background:#fff;margin:0;padding:0}
  /* Force colors to print */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  /* Each person card starts on new page and fills it */
  .r-person-block{page-break-before:always;break-before:page;min-height:220mm;display:flex;flex-direction:column}
  .r-person-block:first-child{page-break-before:avoid;break-before:avoid;min-height:auto}
  /* First page: header + kpis + first person */
  .r-first-page{page-break-after:avoid;break-after:avoid}
  /* Projects on their own page */
  .r-projects-block{page-break-before:always;break-before:page;min-height:220mm;display:flex;flex-direction:column}
  /* Task rows fill space evenly */
  .r-task{padding:10px 0;border-bottom:1px solid #F0F4F8;flex:1}
  .r-task:last-child{border-bottom:none}
  /* Cards fill height */
  .rcard{box-shadow:none!important;border:1px solid #ddd!important;flex:1;display:flex;flex-direction:column}
  .r-tasks-list{flex:1;display:flex;flex-direction:column}
  /* Bigger progress bars */
  .r-bar-wrap{height:10px!important}
  .r-bar-fill{height:10px!important}
  /* Controls hidden */
  .r-controls{display:none!important}
  /* Compact section labels */
  .r-section{margin:8px 0 6px;font-size:9px}
  @page{margin:12mm 12mm 18mm 12mm;size:A4}
  @page{@bottom-center{content:"Página " counter(page) " de " counter(pages);font-family:'Courier New',monospace;font-size:9pt;color:#6B7280}}
  .r-page-footer{display:flex!important}
}
/* ── Report ── */
#reportContainer{display:none;padding:0;max-width:900px;margin:0 auto;font-family:system-ui,sans-serif}
.r-header{background:#1E3A6E;color:#fff;padding:16px 22px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-header-left{display:flex;align-items:center;gap:14px}
.r-logo{height:44px;width:auto;border-radius:4px;background:#fff;padding:4px 8px}
.r-title{font-size:18px;font-weight:800;letter-spacing:.3px}
.r-sub{font-size:11px;color:#A8BFDE;letter-spacing:1px;margin-top:2px;font-family:'Courier New',monospace}
.r-meta{text-align:right}
.r-week{font-size:16px;font-weight:700}
.r-date{font-size:10px;color:#A8BFDE;margin-top:2px}
.r-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.r-kpi{background:#fff;border:1px solid #C5D0E0;border-radius:8px;padding:10px;text-align:center;border-top:3px solid #1E3A6E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-kpi-v{font-size:22px;font-weight:900;font-family:'Courier New',monospace;color:#1E3A6E}
.r-kpi-l{font-size:10px;color:#6B7280;font-family:'Courier New',monospace;margin-top:3px;letter-spacing:.5px}
.r-section{font-size:10px;font-weight:700;font-family:'Courier New',monospace;color:#1E3A6E;letter-spacing:3px;margin:12px 0 8px;border-bottom:2px solid #1E3A6E;padding-bottom:4px}
.rcard{background:#fff;border:1px solid #C5D0E0;border-radius:8px;padding:14px;margin-bottom:10px;break-inside:avoid}
.r-person-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #E8EFF6}
.r-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;font-family:'Courier New',monospace;flex-shrink:0}
.r-person-name{font-weight:700;font-size:13px;color:#111827}
.r-person-rol{font-size:10px;color:#6B7280;font-family:'Courier New',monospace}
.r-task{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #F0F4F8}
.r-task:last-child{border-bottom:none;padding-bottom:0}
.r-prio{border-radius:4px;padding:2px 7px;font-size:9px;font-weight:700;font-family:'Courier New',monospace;white-space:nowrap;flex-shrink:0;margin-top:1px}
.r-task-info{flex:1;min-width:0}
.r-task-title{font-size:12px;font-weight:600;color:#111827;margin-bottom:2px}
.r-task-meta{font-size:10px;color:#6B7280;font-family:'Courier New',monospace}
.r-est{border-radius:4px;padding:2px 7px;font-size:9px;font-weight:600;font-family:'Courier New',monospace;white-space:nowrap;flex-shrink:0;margin-top:1px}
.r-proy-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F0F4F8}
.r-proy-row:last-child{border-bottom:none}
.r-proy-name{font-size:12px;font-weight:600;color:#111827;min-width:180px}
.r-proy-bar{flex:1;background:#E5E7EB;border-radius:99px;height:8px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-proy-fill{height:100%;border-radius:99px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-proy-pct{font-size:11px;font-weight:700;font-family:'Courier New',monospace;color:#1E3A6E;min-width:36px;text-align:right}
.r-proy-est{font-size:9px;font-family:'Courier New',monospace}
.r-footer{margin-top:24px;padding-top:12px;border-top:2px solid #1E3A6E;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.r-page-footer{display:none;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9pt;font-family:'Courier New',monospace;color:#6B7280;padding:6px;border-top:1px solid #ddd;background:#fff}
.r-footer-left{font-size:10px;color:#6B7280;font-family:'Courier New',monospace}
.r-footer-right{font-size:10px;color:#1E3A6E;font-family:'Courier New',monospace;font-weight:700}
.r-no-tasks{font-size:11px;color:#9CA3AF;font-style:italic;padding:6px 0}
.r-controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.r-back{background:#fff;border:1.5px solid #1E3A6E;color:#1E3A6E;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;font-family:'Courier New',monospace}
.r-print{background:linear-gradient(135deg,#1E3A6E,#2B5298);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px}
.r-whatsapp{background:#25D366;color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px}
@media(max-width:600px){#main{padding:12px}.st{font-size:17px}}
</style>
</head>

    <div class="fi"><label>Nivel</label><select id="per_nv"><option>Gerente</option><option>Senior</option><option>Junior</option><option>Asistente</option><option>Pasante</option></select></div>
    <div class="fi"><label>Color</label><div class="cprow" id="cpick"></div></div>
    <button class="bp" style="width:100%;margin-top:8px" onclick="savePer()">Guardar Miembro</button>
  </div>
</div>

<!-- ═══ MODAL SEMANAS ═══ -->
<div class="mo" id="mSem">
  <div class="mb" style="max-width:420px">
    <div class="mh"><span class="mt">Gestionar Semanas</span><button class="mc" onclick="cm('mSem')">✕</button></div>
    <div id="semList" style="margin-bottom:14px"></div>
    <div class="fi"><label>Nueva Semana</label><input id="sem_n" placeholder="Ej: Sem 5 · 27 Ene – 31 Ene"/></div>
    <button class="bp" style="width:100%" onclick="addSem()">+ Agregar Semana</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  STORAGE KEY
// ═══════════════════════════════════════════════
const SK = 'ing_panel_v3';

// ═══════════════════════════════════════════════
//  DEFAULT DATA
// ═══════════════════════════════════════════════
const DEF = {
  semanas: ['Sem 1','Sem 2','Sem 3','Sem 4'],
  semanaActiva: 'Sem 1',
  team: [
    {id:1,nombre:'Alejandro Castro',rol:'Gerente de Ingeniería',      avatar:'AC',nivel:'Gerente',  color:'#D97706'},
    {id:2,nombre:'Anthony Jiménez', rol:'Ing. Jr. Diseño Estructural',avatar:'AJ',nivel:'Junior',   color:'#2563EB'},
    {id:3,nombre:'Ignacio Machua',  rol:'Asistente de Diseño',        avatar:'IM',nivel:'Asistente',color:'#7C3AED'},
    {id:4,nombre:'Juan José Ávila', rol:'Asistente de Diseño',        avatar:'JA',nivel:'Asistente',color:'#059669'},
  ],
  proyectos: [],
  tareas: [],
};

// ═══════════════════════════════════════════════
//  STATE — loaded from localStorage or defaults
// ═══════════════════════════════════════════════
let S = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(SK);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function saveState(){
  try{ localStorage.setItem(SK, JSON.stringify(S)); }catch(e){}
}

// ═══════════════════════════════════════════════
//  EXPORT / IMPORT
// ═══════════════════════════════════════════════
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'panel-ingenieria-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('✓ Datos exportados','#059669');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.team || !data.proyectos) throw new Error();
      S = data;
      saveState();
      render();
      toast('✓ Datos importados correctamente','#059669');
    }catch(err){ alert('El archivo no es válido.'); }
  };
  r.readAsText(file);
  e.target.value='';
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
const EC = {'En Progreso':'#D97706','Completado':'#059669','Pendiente':'#6B7280','Bloqueado':'#DC2626'};
const EB = {'En Progreso':'#FFFBEB','Completado':'#ECFDF5','Pendiente':'#F9FAFB','Bloqueado':'#FEF2F2'};
const PC = {'Alta':'#DC2626','Media':'#D97706','Baja':'#059669'};
const PB = {'Alta':'#FEF2F2','Media':'#FFFBEB','Baja':'#ECFDF5'};
const NC = {'Gerente':'#D97706','Senior':'#DC2626','Junior':'#2563EB','Asistente':'#7C3AED','Pasante':'#059669'};
const COLORS = ['#2563EB','#7C3AED','#059669','#D97706','#DC2626','#0891B2','#DB2777','#65A30D','#EA580C','#4F46E5','#0F766E','#B45309'];

const gP = id => S.proyectos.find(p=>p.id===id);
const gM = id => S.team.find(t=>t.id===id);

function inits(n){ return n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function pts(pid){ return S.tareas.filter(t=>t.asignadoA===pid&&t.estado==='Completado').length*10; }
function stars(p){ return p>=50?5:p>=35?4:p>=20?3:p>=10?2:p>=5?1:0; }
function stH(n){ return [1,2,3,4,5].map(i=>`<span class="star ${i<=n?'on':'off'}">★</span>`).join(''); }
function bdg(l,c,b){ return `<span class="bdg" style="background:${b||c+'18'};color:${c};border:1px solid ${c}28">${l}</span>`; }
function av(ini,sz=36,col='#2563EB'){ return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.33)}px;background:${col}">${ini}</div>`; }
function bar(v,col,h=8){ return `<div class="bw" style="height:${h}px"><div class="bf" style="width:${Math.min(v,100)}%;background:${col}"></div></div>`; }
function today(){ return new Date().toISOString().split('T')[0]; }
function dL(d){ if(!d)return '—'; try{const[y,m,dd]=d.split('-');const ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return `${dd} ${ms[parseInt(m)-1]} ${y}`;}catch{return d;} }

function toast(msg,col='#059669'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// auto-progress: % based on task avance field
function autoProgress(proyId){
  const all = S.tareas.filter(t=>t.proyectoId===proyId);
  if(!all.length) return null;
  var total = all.reduce(function(sum,t){
    var av = t.avance!=null ? t.avance : (t.estado==='Completado'?100:t.estado==='En Progreso'?50:0);
    return sum+av;
  },0);
  return Math.round(total/all.length);
}

// ═══════════════════════════════════════════════
//  ALERTAS
// ═══════════════════════════════════════════════
function checkAlertas(){
  const bar=document.getElementById('abar');
  const dot=document.getElementById('alertDot');
  const td=today();
  const alerts=[];
  S.tareas.forEach(t=>{
    if(t.estado==='Bloqueado') alerts.push(`⚠ Bloqueada: "${t.titulo}"`);
    else if(t.deadline&&t.deadline<td&&t.estado!=='Completado') alerts.push(`🔴 Vencida: "${t.titulo}" (${dL(t.deadline)})`);
    else if(t.deadline&&t.deadline===td&&t.estado!=='Completado') alerts.push(`🟡 Vence hoy: "${t.titulo}"`);
  });
  if(alerts.length){
    bar.innerHTML=`<span style="color:var(--red);font-family:var(--mono);font-size:10px;font-weight:700;flex-shrink:0">🚨 ${alerts.length} ALERTA${alerts.length>1?'S':''}</span>`+alerts.map(a=>`<div class="aitem">${a}</div>`).join('');
    bar.classList.add('show');
    dot&&dot.classList.add('show');
  } else {
    bar.classList.remove('show');
    dot&&dot.classList.remove('show');
  }
}

// ═══════════════════════════════════════════════
//  WEEK TABS
// ═══════════════════════════════════════════════
function renderWTabs(){
  document.getElementById('wtabs').innerHTML =
    S.semanas.map(s=>`<button class="wt ${s===S.semanaActiva?'active':''}" onclick="setSem('${s}')">${s}</button>`).join('')
    +`<button class="wt np" onclick="om('mSem')" title="Gestionar semanas">⚙</button>`;
}
function setSem(s){ S.semanaActiva=s; saveState(); renderWTabs(); render(); }

// ═══════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════
let vista='dashboard';
function sv(v){
  vista=v;
  const keys=['dashboard','proyectos','tareas','personal','graficas'];
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('active',keys[i]===v));
  render();
}

// ═══════════════════════════════════════════════
//  RENDER DISPATCHER
// ═══════════════════════════════════════════════
function render(){
  checkAlertas();
  const m=document.getElementById('main');
  if(vista==='dashboard')  m.innerHTML=rDash();
  else if(vista==='proyectos') m.innerHTML=rProy();
  else if(vista==='tareas')    m.innerHTML=rTar();
  else if(vista==='personal')  m.innerHTML=rPer();
  else if(vista==='graficas')  m.innerHTML=rGraf();
}

// ═══════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════
function rDash(){
  const sem=S.tareas.filter(t=>t.semana===S.semanaActiva);
  const comp=sem.filter(t=>t.estado==='Completado').length;
  const bloq=S.tareas.filter(t=>t.estado==='Bloqueado').length;
  const activos=S.proyectos.filter(p=>p.estado==='En Progreso').length;

  const kpis=[
    {l:'Proyectos Activos',v:activos,i:'⬢',c:'#2563EB',bg:'#EBF0F8'},
    {l:'Tareas '+S.semanaActiva,v:sem.length,i:'☰',c:'#D97706',bg:'#FFFBEB'},
    {l:'Completadas',v:comp,i:'✓',c:'#059669',bg:'#ECFDF5'},
    {l:'Bloqueadas',v:bloq,i:'⚠',c:'#DC2626',bg:'#FEF2F2'},
  ].map(k=>`<div class="card kpi" style="background:${k.bg};border-color:${k.c}20">
    <div class="kpi-ic" style="color:${k.c}">${k.i}</div>
    <div class="kpi-v" style="color:${k.c}">${k.v}</div>
    <div class="kpi-l" style="color:${k.c}99">${k.l}</div>
  </div>`).join('');

  const prows = S.proyectos.length ? S.proyectos.map(p=>{
    const ap=autoProgress(p.id); const prog=ap!==null?ap:p.progreso;
    const pc=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    const members=[...new Set(S.tareas.filter(t=>t.proyectoId===p.id).map(t=>t.asignadoA))]
      .map(id=>{const m=gM(id);return m?av(m.avatar,22,m.color):'';}).join('');
    return `<div class="card mb12">
      <div class="row mb8" style="justify-content:space-between">
        <div><div class="bo" style="font-size:13px">${p.nombre}</div><div class="mu xs mono">${p.cliente||''}</div></div>
        <div class="row">${bdg(p.prioridad,PC[p.prioridad],PB[p.prioridad])}${bdg(p.estado,EC[p.estado],EB[p.estado])}<span style="color:${pc};font-family:var(--mono);font-weight:800;font-size:16px">${prog}%</span></div>
      </div>
      ${bar(prog,pc,9)}
      <div class="row" style="justify-content:space-between;margin-top:7px">
        <div class="row" style="gap:3px">${members}</div>
        <span class="xs mu mono">Entrega: ${dL(p.fechaFin)}</span>
      </div>
    </div>`;
  }).join('') : `<div class="card empty"><div class="empty-ic">📁</div><div>Sin proyectos aún.</div><button class="bp" style="margin-top:12px" onclick="sv('proyectos')">Crear primer proyecto</button></div>`;

  const teamH=S.team.map(m=>{
    const p=pts(m.id);const s=stars(p);
    const tot=S.tareas.filter(t=>t.asignadoA===m.id).length;
    const c=S.tareas.filter(t=>t.asignadoA===m.id&&t.estado==='Completado').length;
    return `<div class="card">
      <div class="row mb8">${av(m.avatar,34,m.color)}<div><div class="bo sm">${m.nombre}</div><div class="mu xs mono">${m.rol}</div></div></div>
      <div class="row mb6">${stH(s)}<span class="mu xs mono" style="margin-left:3px">${p} pts</span></div>
      <div class="mu xs mono mb6">${c}/${tot} completadas</div>
      ${bar(tot>0?(c/tot)*100:0,m.color,5)}
    </div>`;
  }).join('');

  return `<div class="ey">RESUMEN EJECUTIVO</div>
  <div class="st">Panel de Control — ${S.semanaActiva}</div>
  <div class="g4 mb20">${kpis}</div>
  <div class="ey mb8">AVANCE DE PROYECTOS</div>
  <div class="mb20">${prows}</div>
  <div class="ey mb8">EQUIPO</div>
  <div class="g2">${teamH}</div>`;
}

// ═══════════════════════════════════════════════
//  PROYECTOS
// ═══════════════════════════════════════════════
function rProy(){
  const rows=S.proyectos.length ? S.proyectos.map(p=>{
    const ap=autoProgress(p.id); const prog=ap!==null?ap:p.progreso;
    const pc=prog>70?'#059669':'#D97706';
    const tP=S.tareas.filter(t=>t.proyectoId===p.id);
    const comp=tP.filter(t=>t.estado==='Completado').length;
    const members=[...new Set(tP.map(t=>t.asignadoA))].map(id=>{
      const m=gM(id);
      return m?`<span class="row" style="gap:4px;font-size:10px;color:var(--text3);font-family:var(--mono)">${av(m.avatar,20,m.color)} ${m.nombre}</span>`:'';
    }).join('');
    return `<div class="card mb12">
      <div class="row mb10" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
        <div style="flex:1;min-width:180px">
          <div class="row mb6">${bdg(p.estado,EC[p.estado],EB[p.estado])}${bdg(p.prioridad,PC[p.prioridad],PB[p.prioridad])}</div>
          <div class="bo" style="font-size:14px;margin-bottom:2px">${p.nombre}</div>
          <div class="mu xs mono">${p.cliente?'Cliente: '+p.cliente:''}</div>
          ${p.desc?`<div class="xs mu" style="margin-top:5px">${p.desc}</div>`:''}
        </div>
        <div class="row np">
          <button class="bs" onclick="oMP(${p.id})">✏ Editar</button>
          <button class="bd" onclick="delProy(${p.id})">✕</button>
        </div>
      </div>
      <div class="row mb5" style="justify-content:space-between">
        <span class="xs mono mu">Avance${ap!==null?' (auto)':''}</span>
        <span style="color:${pc};font-family:var(--mono);font-weight:800">${prog}%</span>
      </div>
      ${bar(prog,pc,11)}
      <div class="row" style="gap:14px;margin-top:10px;flex-wrap:wrap">
        <span class="xs mu mono">📅 ${dL(p.fechaInicio)} → ${dL(p.fechaFin)}</span>
        <span class="xs mono" style="color:#059669">✓ ${comp}/${tP.length} tareas</span>
      </div>
      ${members?`<div class="row" style="gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border2);flex-wrap:wrap">${members}</div>`:''}
    </div>`;
  }).join('') : `<div class="card empty"><div class="empty-ic">📁</div><div>No hay proyectos. Crea el primero.</div></div>`;

  return `<div class="row mb20" style="justify-content:space-between">
    <div><div class="ey">GESTIÓN</div><div class="st" style="margin-bottom:0">Proyectos</div></div>
    <button class="bp np" onclick="oMP()">+ Nuevo Proyecto</button>
  </div>${rows}`;
}

// ═══════════════════════════════════════════════
//  TAREAS
// ═══════════════════════════════════════════════
function rTar(){
  const td=today();
  const sem=S.tareas.filter(t=>t.semana===S.semanaActiva);
  let html=`<div class="row mb20" style="justify-content:space-between">
    <div><div class="ey">SEGUIMIENTO · ${S.semanaActiva}</div><div class="st" style="margin-bottom:0">Tareas del Equipo</div></div>
    <button class="bp np" onclick="oMT()">+ Nueva Tarea</button>
  </div>`;

  let hayTareas=false;
  S.team.forEach(m=>{
    const tm=sem.filter(t=>t.asignadoA===m.id);
    if(!tm.length) return;
    hayTareas=true;
    const rows=tm.map(t=>{
      const proy=gP(t.proyectoId);
      const venc=t.deadline&&t.deadline<td&&t.estado!=='Completado';
      const opts=['Pendiente','En Progreso','Completado','Bloqueado'].map(e=>`<option value="${e}" ${t.estado===e?'selected':''}>${e}</option>`).join('');
      return `<div class="card row mb8" style="flex-wrap:wrap;${venc?'border-color:#FECACA;background:#FEF9F9;':''}">
        <div style="flex:1;min-width:160px">
          <div class="bo sm mb4">${t.titulo}${venc?` <span style="color:var(--red);font-size:9px;font-family:var(--mono)">VENCIDA</span>`:''}</div>
          <div class="mu xs mono">${proy?proy.nombre:'—'}${t.deadline?' · '+dL(t.deadline):''}</div>
          ${t.notas?`<div class="xs mu" style="margin-top:3px;font-style:italic">${t.notas.slice(0,80)}${t.notas.length>80?'…':''}</div>`:''}
          ${t.comentarios?.length?`<div class="xs mono" style="color:#1E3A6E;margin-top:3px">💬 ${t.comentarios.length}</div>`:''}
        </div>
        <div class="row np" style="gap:5px;flex-wrap:wrap">
          ${bdg(t.prioridad,PC[t.prioridad],PB[t.prioridad])}
          <select class="ss" onchange="changeEst(${t.id},this.value)" style="background:${EB[t.estado]};border-color:${EC[t.estado]}50;color:${EC[t.estado]}">${opts}</select>
          <button class="bs" onclick="oMT(${t.id})">✏</button>
          <button class="bs" onclick="oDet(${t.id})">👁</button>
          <button class="bd" onclick="delTar(${t.id})">✕</button>
        </div>
      </div>`;
    }).join('');
    html+=`<div class="mb16">
      <div class="row mb8">${av(m.avatar,28,m.color)}<span class="bo sm">${m.nombre}</span><span class="mu xs mono">— ${m.rol}</span></div>
      ${rows}
    </div>`;
  });

  if(!hayTareas) html+=`<div class="card empty"><div class="empty-ic">📋</div><div>Sin tareas para ${S.semanaActiva}.</div><button class="bp np" style="margin-top:12px" onclick="oMT()">Crear tarea</button></div>`;
  return html;
}

// ═══════════════════════════════════════════════
//  PERSONAL
// ═══════════════════════════════════════════════
function rPer(){
  const cards=S.team.map(m=>{
    const p=pts(m.id);const s=stars(p);
    const todas=S.tareas.filter(t=>t.asignadoA===m.id);
    const comp=todas.filter(t=>t.estado==='Completado').length;
    const enP=todas.filter(t=>t.estado==='En Progreso').length;
    const pend=todas.filter(t=>t.estado==='Pendiente').length;
    const bloq=todas.filter(t=>t.estado==='Bloqueado').length;
    const pct=todas.length>0?Math.round((comp/todas.length)*100):0;
    const tags=todas.slice(0,4).map(t=>`<span style="background:${EB[t.estado]};border:1px solid ${EC[t.estado]}28;border-radius:5px;padding:2px 7px;font-size:9px;color:${EC[t.estado]};font-family:var(--mono)">${t.titulo.slice(0,24)}${t.titulo.length>24?'…':''}</span>`).join('');
    const rec=s>=4?`<div class="rb"><span>🏆</span><span>${s===5?'Rendimiento Excepcional — Candidato a reconocimiento':'Alto Desempeño — Excelente contribución'}</span></div>`:'';
    return `<div class="card mb12">
      <div class="row mb14" style="align-items:flex-start;flex-wrap:wrap;gap:12px">
        <div class="row">${av(m.avatar,46,m.color)}
          <div>
            <div class="bo" style="font-size:15px">${m.nombre}</div>
            <div class="mu xs mono mb6">${m.rol}</div>
            <div class="row" style="gap:5px">
              ${bdg(m.nivel,NC[m.nivel]||'#7C3AED')}
              <button class="bs np" onclick="oMPer(${m.id})" style="font-size:9px;padding:2px 7px">✏ Editar</button>
              ${m.id!==1?`<button class="bd np" onclick="delPer(${m.id})" style="font-size:9px;padding:2px 7px">✕</button>`:''}
            </div>
          </div>
        </div>
        <div style="flex:1;min-width:190px">
          <div class="row mb8">${stH(s)}<span class="mono bo" style="color:#D97706;margin-left:6px">${p} pts</span></div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
            ${[['✓',comp,'#059669','#ECFDF5'],['▶',enP,'#D97706','#FFFBEB'],['⏸',pend,'#6B7280','#F9FAFB'],['⚠',bloq,'#DC2626','#FEF2F2']].map(([i,v,c,bg])=>`
            <div style="background:${bg};border:1px solid ${c}18;border-radius:7px;padding:7px;text-align:center">
              <div style="color:${c};font-weight:900;font-size:18px;font-family:var(--mono)">${v}</div>
              <div class="xs mono" style="color:${c}99">${i}</div>
            </div>`).join('')}
          </div>
        </div>
        <div style="min-width:80px;text-align:center">
          <div class="xs mono mb5" style="color:var(--muted2)">CUMPLIMIENTO</div>
          <div style="font-size:26px;font-weight:900;font-family:var(--mono);color:${pct>0?'#2563EB':'var(--muted3)'}">${pct}%</div>
          ${bar(pct,'#2563EB',5)}
        </div>
      </div>
      <div class="div"></div>
      <div class="xs mu mono mb6">TAREAS RECIENTES</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${tags}${todas.length>4?`<span class="xs mu mono">+${todas.length-4} más</span>`:''}</div>
      ${rec}
    </div>`;
  }).join('');

  return `<div class="row mb20" style="justify-content:space-between">
    <div><div class="ey">RENDIMIENTO Y EQUIPO</div><div class="st" style="margin-bottom:0">Personal de Ingeniería</div></div>

//  GRÁFICAS
// ═══════════════════════════════════════════════
function rGraf(){
  const proyB=S.proyectos.length?S.proyectos.map(p=>{
    const ap=autoProgress(p.id);const prog=ap!==null?ap:p.progreso;
    const c=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    return `<div class="cbh"><div class="cl">${p.nombre.slice(0,20)}</div><div class="ct"><div class="cf" style="width:${prog}%;background:${c}"><span class="cv">${prog}%</span></div></div></div>`;
  }).join(''):`<div class="mu xs mono">Sin proyectos.</div>`;

  const perB=S.team.map(m=>{
    const tot=S.tareas.filter(t=>t.asignadoA===m.id).length;
    const comp=S.tareas.filter(t=>t.asignadoA===m.id&&t.estado==='Completado').length;
    const pct=tot>0?Math.round((comp/tot)*100):0;
    return `<div class="cbh"><div class="cl">${m.nombre.split(' ')[0]}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${m.color}"><span class="cv">${pct}%</span></div></div></div>`;
  }).join('');

  const totT=S.tareas.length||1;
  const estB=['Completado','En Progreso','Pendiente','Bloqueado'].map(e=>{
    const n=S.tareas.filter(t=>t.estado===e).length;
    const pct=Math.round((n/totT)*100);
    return `<div class="cbh"><div class="cl">${e}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${EC[e]}"><span class="cv">${n} (${pct}%)</span></div></div></div>`;
  }).join('');

  const semB=S.semanas.map(s=>{
    const n=S.tareas.filter(t=>t.semana===s).length;
    const c=S.tareas.filter(t=>t.semana===s&&t.estado==='Completado').length;
    const pct=n>0?Math.round((c/n)*100):0;
    return `<div class="cbh"><div class="cl">${s}</div><div class="ct"><div class="cf" style="width:${pct}%;background:#059669"><span class="cv">${c}/${n}</span></div></div></div>`;
  }).join('');

  const ptsB=S.team.map(m=>{
    const p=pts(m.id);const pct=Math.min(Math.round((p/60)*100),100);
    return `<div class="cbh"><div class="cl">${m.nombre.split(' ')[0]}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${m.color}"><span class="cv">${p} pts</span></div></div></div>`;
  }).join('');

  return `<div class="ey">ANÁLISIS</div><div class="st">Gráficas de Progreso</div>
  <div class="g3">
    <div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📊 Avance por Proyecto</div>${proyB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">👤 Cumplimiento por Persona</div>${perB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📋 Tareas por Estado</div>${estB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📅 Por Semana</div>${semB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">⭐ Puntos por Persona</div>${ptsB}</div>
  </div>`;
}

let _ePid=null;

  document.getElementById('pp_p').value =p?.prioridad||'Alta';
  const pr=p?.progreso??0;
  document.getElementById('pp_pr').value=pr;
  document.getElementById('pp_pv').textContent=pr;
  document.getElementById('pp_fi').value=p?.fechaInicio||'';
  document.getElementById('pp_ff').value=p?.fechaFin   ||'';

function saveProy(){
  const d={
    nombre:document.getElementById('pp_n').value.trim(),
    cliente:document.getElementById('pp_c').value.trim(),
    estado:document.getElementById('pp_e').value,
    prioridad:document.getElementById('pp_p').value,
    progreso:parseInt(document.getElementById('pp_pr').value)||0,
    fechaInicio:document.getElementById('pp_fi').value,
    fechaFin:document.getElementById('pp_ff').value,

  };

}
function delProy(id){

  S.tareas=S.tareas.filter(t=>t.proyectoId!==id);
  saveState();render();toast('✓ Proyecto eliminado','#DC2626');

let _eTid=null;
function oMT(id=null){
  _eTid=id;
  const t=id?S.tareas.find(x=>x.id===id):null;
  document.getElementById('mtT').textContent=id?'Editar Tarea':'Nueva Tarea';
  document.getElementById('tp_p').innerHTML=S.proyectos.map(p=>`<option value="${p.id}" ${t?.proyectoId===p.id?'selected':''}>${p.nombre}</option>`).join('');
  document.getElementById('tp_a').innerHTML=S.team.map(m=>`<option value="${m.id}" ${t?.asignadoA===m.id?'selected':''}>${m.nombre}</option>`).join('');
  document.getElementById('tp_s').innerHTML=S.semanas.map(s=>`<option value="${s}" ${(t?.semana||S.semanaActiva)===s?'selected':''}>${s}</option>`).join('');
  document.getElementById('tp_t').value =t?.titulo   ||'';
  document.getElementById('tp_dl').value=t?.deadline ||'';
  document.getElementById('tp_e').value =t?.estado   ||'Pendiente';
  document.getElementById('tp_pr').value=t?.prioridad||'Media';
  document.getElementById('tp_n').value =t?.notas    ||'';
  var av=t?.avance!=null?t.avance:(t?.estado==='Completado'?100:0);
  document.getElementById('tp_av').value=av;
  document.getElementById('tp_av_lbl').textContent=av;
  om('mTar');
}
function saveTar(){
  var estadoVal=document.getElementById('tp_e').value;
  var avanceVal=parseInt(document.getElementById('tp_av').value)||0;
  if(estadoVal==='Completado') avanceVal=100;
  if(estadoVal==='Pendiente' && avanceVal===0) avanceVal=0;
  const d={
    proyectoId:parseInt(document.getElementById('tp_p').value)||0,
    titulo:document.getElementById('tp_t').value.trim(),
    asignadoA:parseInt(document.getElementById('tp_a').value)||0,
    semana:document.getElementById('tp_s').value,
    deadline:document.getElementById('tp_dl').value,
    estado:estadoVal,
    prioridad:document.getElementById('tp_pr').value,
    notas:document.getElementById('tp_n').value.trim(),
    avance:avanceVal
  };
  if(!d.titulo){alert('El título es requerido.');return;}
  if(_eTid){
    const old=S.tareas.find(t=>t.id===_eTid);
    const hist=[...(old.historial||[])];
    if(old.estado!==d.estado) hist.push({estado:d.estado,fecha:today(),autor:'Alejandro Castro'});
    S.tareas=S.tareas.map(t=>t.id===_eTid?{...t,...d,historial:hist}:t);
    toast('✓ Tarea actualizada');
  } else {
    S.tareas.push({id:Date.now(),...d,comentarios:[],historial:[{estado:d.estado,fecha:today(),autor:'Alejandro Castro'}]});
    toast('✓ Tarea creada');
  }
  saveState();cm('mTar');render();
}
function changeEst(id,estado){
  S.tareas=S.tareas.map(t=>{
    if(t.id!==id) return t;
    const hist=[...(t.historial||[]),{estado,fecha:today(),autor:'Alejandro Castro'}];
    var nuevoAvance=t.avance!=null?t.avance:0;
    if(estado==='Completado') nuevoAvance=100;
    if(estado==='Pendiente' && nuevoAvance===0) nuevoAvance=0;
    return {...t,estado,avance:nuevoAvance,historial:hist};
  });
  saveState();toast('✓ Estado actualizado');render();
}
function delTar(id){
  const t=S.tareas.find(x=>x.id===id);
  if(!confirm(`¿Eliminar tarea "${t?.titulo}"?`)) return;
  S.tareas=S.tareas.filter(x=>x.id!==id);
  saveState();render();toast('✓ Tarea eliminada','#DC2626');
}

    ${hist||'<div class="xs mu mono">Sin historial.</div>'}`;

function addComment(tid){
  const txt=document.getElementById('newc').value.trim();if(!txt)return;
  S.tareas=S.tareas.map(t=>{
    if(t.id!==tid)return t;
    return {...t,comentarios:[...(t.comentarios||[]),{autor:'Alejandro Castro',texto:txt,fecha:today()}]};
  });
  saveState();toast('✓ Comentario agregado');oDet(tid);
}

  S.semanas.splice(i,1);
  saveState();renderWTabs();renderSemList();toast('✓ Semana eliminada','#DC2626');

function buildReport(){
  const EC = {'En Progreso':'#D97706','Completado':'#059669','Pendiente':'#6B7280','Bloqueado':'#DC2626'};
  const EB = {'En Progreso':'#FFFBEB','Completado':'#ECFDF5','Pendiente':'#F9FAFB','Bloqueado':'#FEF2F2'};

  const logoTag = document.querySelector('#hdr img');

    {l:'Completadas',v:comp,c:'#059669'},
    {l:'Pendientes / Bloq.',v:pend+bloq,c:'#DC2626'},

      +'<div style="text-align:right">'
      +(pts(m.id)>=30?'<span style="font-size:18px">🏆</span>':pts(m.id)>=10?'<span style="font-size:18px">⭐</span>':'')
      +'<div style="font-size:11px;font-family:monospace;color:#1E3A6E;font-weight:700">'+pts(m.id)+' pts</div>'
      +'</div>'
      +'</div>'
      +'<div class="r-tasks-list">'+tasksHtml+'</div>'
      +'</div>'
      +'</div>';
  });

  // Projects block - own page
  const proyHtml = S.proyectos.length ? S.proyectos.map(p=>{
    const ap = autoProgress(p.id);
    const prog = ap!==null?ap:p.progreso;
    const pc = prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    return '<div class="r-proy-row">'
      +'<div class="r-proy-name">'+p.nombre+'<br><span style="font-size:10px;color:#6B7280;font-weight:400">'+( p.cliente||'')+'</span></div>'
      +'<div style="flex:1;background:#E5E7EB;border-radius:99px;height:12px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact">'
      +'<div style="width:'+prog+'%;height:100%;background:'+pc+';border-radius:99px;-webkit-print-color-adjust:exact;print-color-adjust:exact"></div></div>'
      +'<div class="r-proy-pct">'+prog+'%</div>'
      +'<span class="r-proy-est bdg" style="background:'+EB[p.estado]+';color:'+EC[p.estado]+';border:1px solid '+EC[p.estado]+'30;font-size:9px;padding:2px 6px;border-radius:4px;font-family:monospace">'+p.estado+'</span>'
      +'</div>';
  }).join('') : '<div style="padding:20px;color:#9CA3AF;font-style:italic">Sin proyectos registrados.</div>';

  document.getElementById('reportContent').innerHTML =
    // PAGE 1: Header + KPIs + summary
    '<div class="r-first-page">'
    +'<div class="r-header">'
    +(logoSrc?'<div class="r-header-left"><img src="'+logoSrc+'" class="r-logo" alt="Elmufdi"/><div><div class="r-title">ELMUFDI CONSTRUCCIONES</div><div class="r-sub">DEPARTAMENTO DE INGENIERÍA · REPORTE SEMANAL</div></div></div>'
    :'<div class="r-header-left"><div style="width:44px;height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1E3A6E;font-weight:900;font-size:16px">EC</div><div><div class="r-title">ELMUFDI CONSTRUCCIONES</div><div class="r-sub">DEPARTAMENTO DE INGENIERÍA · REPORTE SEMANAL</div></div></div>')
    +'<div class="r-meta"><div class="r-week">'+sem+'</div><div class="r-date">'+fechaStr+'</div></div>'
    +'</div>'
    +'<div class="r-kpis">'+kpis+'</div>'
    // Summary table
    +'<div class="rcard" style="margin-bottom:0">'
    +'<div style="font-size:10px;font-weight:700;font-family:monospace;color:#1E3A6E;letter-spacing:2px;margin-bottom:12px">RESUMEN DEL EQUIPO</div>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
    +'<thead><tr style="background:#EBF0F8">'
    +'<th style="text-align:left;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">PERSONA</th>'
    +'<th style="text-align:center;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">TAREAS</th>'
    +'<th style="text-align:center;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">COMPLETADAS</th>'
    +'<th style="text-align:center;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">EN PROGRESO</th>'
    +'<th style="text-align:center;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">PENDIENTES</th>'
    +'<th style="text-align:center;padding:8px 10px;font-family:monospace;font-size:10px;color:#1E3A6E;border-bottom:2px solid #1E3A6E">PUNTOS</th>'
    +'</tr></thead><tbody>'
    + S.team.map(function(m,i){
        const tm = tareasSem.filter(t=>t.asignadoA===m.id);
        const c = tm.filter(t=>t.estado==='Completado').length;
        const ep = tm.filter(t=>t.estado==='En Progreso').length;
        const p = tm.filter(t=>t.estado==='Pendiente'||t.estado==='Bloqueado').length;
        return '<tr style="background:'+(i%2===0?'#fff':'#F8FAFC')+';border-bottom:1px solid #E5E7EB">'
          +'<td style="padding:8px 10px;font-weight:600">'
          +'<div style="display:flex;align-items:center;gap:8px">'
          +'<div style="width:24px;height:24px;border-radius:50%;background:'+m.color+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;font-family:monospace;flex-shrink:0">'+m.avatar+'</div>'
          +m.nombre+'</div></td>'
          +'<td style="text-align:center;padding:8px;font-family:monospace;font-weight:700">'+tm.length+'</td>'
          +'<td style="text-align:center;padding:8px;color:#059669;font-family:monospace;font-weight:700">'+c+'</td>'
          +'<td style="text-align:center;padding:8px;color:#D97706;font-family:monospace;font-weight:700">'+ep+'</td>'
          +'<td style="text-align:center;padding:8px;color:#DC2626;font-family:monospace;font-weight:700">'+p+'</td>'
          +'<td style="text-align:center;padding:8px;color:#1E3A6E;font-family:monospace;font-weight:700">'+pts(m.id)+'</td>'
          +'</tr>';
      }).join('')
    +'</tbody></table>'
    +'</div>'
    +'</div>'

    // PAGES 2+: One person per page
    + personasHtml

    // LAST PAGE: Projects
    +'<div class="r-projects-block">'
    +'<div class="r-section">ESTADO DE PROYECTOS</div>'
    +'<div class="rcard" style="flex:1">'
    + proyHtml
    +'</div>'
    +'<div class="r-footer">'
    +'<div class="r-footer-left">Generado por Panel de Ingeniería · Elmufdi Construcciones · '+fechaStr+'</div>'
    +'<div class="r-footer-right">GERENTE: ALEJANDRO CASTRO</div>'
    +'</div>'
    +'</div>';
}
function shareWhatsApp(){
  var sem = S.semanaActiva;
  var tareasSem = S.tareas.filter(function(t){return t.semana===sem;});
  var prioLabel = {'Alta':'[ALTA]','Media':'[MEDIA]','Baja':'[BAJA]'};
  var estLabel = {'Completado':'[OK]','En Progreso':'[EN PROG]','Pendiente':'[PEND]','Bloqueado':'[BLOQ]'};
  var prioOrd = {'Alta':0,'Media':1,'Baja':2};
  var fecha = new Date().toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});
  var comp = tareasSem.filter(function(t){return t.estado==='Completado';}).length;
  var bloq = tareasSem.filter(function(t){return t.estado==='Bloqueado';}).length;

  var msg = '*ELMUFDI CONSTRUCCIONES*' + String.fromCharCode(10);
  msg += '*Reporte Semanal - ' + sem + '*' + String.fromCharCode(10);
  msg += '_' + fecha + '_' + String.fromCharCode(10) + String.fromCharCode(10);
  msg += 'Resumen: ' + tareasSem.length + ' tareas | ' + comp + ' completadas | ' + bloq + ' bloqueadas';
  msg += String.fromCharCode(10) + String.fromCharCode(10);

  S.team.forEach(function(m){
    var tareasM = tareasSem.filter(function(t){return t.asignadoA===m.id;})
      .sort(function(a,b){return prioOrd[a.prioridad]-prioOrd[b.prioridad];});
    if(!tareasM.length) return;
    msg += '*' + m.nombre + '*' + String.fromCharCode(10);
    tareasM.forEach(function(t){
      msg += prioLabel[t.prioridad] + ' ' + estLabel[t.estado] + ' ' + t.titulo + String.fromCharCode(10);
    });
    msg += String.fromCharCode(10);
  });

  msg += '_Panel de Ingenieria - Elmufdi Construcciones_';
  var encoded = encodeURIComponent(msg);
  window.open('https://wa.me/?text=' + encoded, '_blank');
}
</script>
