<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel de Ingeniería</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#fff;--card:#fff;--border:#D1DCE8;--border2:#E8EFF6;
  --blue:#2563EB;--blue-lt:#3B82F6;--blue-bg:#EFF6FF;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --muted:#6B7280;--muted2:#9CA3AF;--muted3:#E5E7EB;
  --text:#111827;--text2:#374151;--text3:#6B7280;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --mono:'Courier New',Courier,monospace;
  --r:10px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
/* ── Header ── */
#hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;flex-wrap:wrap;gap:8px;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:36px;height:36px;background:linear-gradient(135deg,#1D4ED8,#60A5FA);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 2px 8px #2563EB40;flex-shrink:0}
.logo-tx{font-weight:800;font-size:13px;letter-spacing:.3px;color:var(--text)}
.logo-sb{color:var(--muted2);font-size:8px;font-family:var(--mono);letter-spacing:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ── Alert bar ── */
#abar{display:none;background:#FEF2F2;border-bottom:2px solid #FECACA;padding:6px 20px;gap:8px;flex-wrap:wrap;align-items:center}
#abar.show{display:flex}
.aitem{background:#FEE2E2;border:1px solid #FECACA;border-radius:5px;padding:3px 9px;font-size:11px;font-family:var(--mono);color:var(--red)}
/* ── Nav ── */
#nav{display:flex;gap:2px;padding:4px 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.nb{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;white-space:nowrap;transition:all .15s}
.nb.active{color:var(--blue);font-weight:700;border-bottom-color:var(--blue);background:var(--blue-bg)}
.nb:hover:not(.active){background:var(--bg);color:var(--text2)}
.nb .badge-dot{width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:2px;display:none}
.nb .badge-dot.show{display:inline-block}
/* ── Main ── */
#main{padding:20px;max-width:1160px;margin:0 auto}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card:hover{box-shadow:var(--sh2)}
/* ── Grids ── */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
/* ── KPI ── */
.kpi{text-align:center;padding:18px 10px}
.kpi-ic{font-size:22px;margin-bottom:6px}
.kpi-v{font-size:28px;font-weight:900;font-family:var(--mono)}
.kpi-l{font-size:9px;font-family:var(--mono);margin-top:3px;letter-spacing:.5px}
/* ── Bar ── */
.bw{background:var(--muted3);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;transition:width .5s ease}
/* ── Badge ── */
.bdg{border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap;display:inline-block}
/* ── Avatar ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--mono);flex-shrink:0}
/* ── Section headers ── */
.ey{color:var(--blue);font-family:var(--mono);font-size:9px;letter-spacing:3px;margin-bottom:3px;font-weight:700}
.st{font-size:20px;font-weight:800;margin-bottom:18px;color:var(--text)}
/* ── Row ── */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ── Stars ── */
.star{font-size:14px}.star.on{color:#F59E0B}.star.off{color:#D1D5DB}
/* ── Buttons ── */
.bp{background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;transition:all .15s;box-shadow:0 2px 6px #2563EB30;white-space:nowrap}
.bp:hover{opacity:.9;box-shadow:0 4px 12px #2563EB40}
.bs{background:#fff;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .15s;box-shadow:var(--sh);white-space:nowrap}
.bs:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.bd{background:var(--red-bg);border:1px solid #FECACA;color:var(--red);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);white-space:nowrap}
.bd:hover{background:#FEE2E2}
.bg2{background:var(--green-bg);border:1px solid #A7F3D0;color:var(--green);border-radius:7px;padding:7px 14px;cursor:pointer;font-size:11px;font-family:var(--mono);font-weight:700}
/* ── Week tabs ── */
.wt{padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-size:10px;font-family:var(--mono);font-weight:700;transition:all .15s;white-space:nowrap}
.wt.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mo.open{display:flex}
.mb{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{color:var(--blue);font-weight:800;font-size:15px}
.mc{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:2px 6px;border-radius:5px}
.mc:hover{background:var(--bg)}
/* ── Form ── */
.fi{margin-bottom:12px}
.fi label{color:var(--text2);font-size:11px;font-family:var(--mono);display:block;margin-bottom:4px;font-weight:700}
.fi input,.fi select,.fi textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-size:12px;font-family:var(--mono);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--blue)}
.fi textarea{resize:vertical;min-height:65px}
.fi input[type=range]{padding:4px 0;cursor:pointer}
/* ── Color picker ── */
.cprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.co{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.co.sel{border-color:#111;transform:scale(1.2)}
/* ── Status select inline ── */
select.ss{border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;border-width:1.5px;border-style:solid}
/* ── Historial ── */
.hi{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2);align-items:flex-start}
.hd{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
/* ── Comments ── */
.ci{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:7px}
.cm{color:var(--muted2);font-size:9px;font-family:var(--mono);margin-bottom:3px}
/* ── Charts ── */
.cbh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cl{font-size:10px;font-family:var(--mono);color:var(--text3);width:130px;flex-shrink:0;text-align:right}
.ct{flex:1;background:var(--muted3);border-radius:99px;height:18px;overflow:hidden}
.cf{height:100%;border-radius:99px;transition:width .6s ease;display:flex;align-items:center;padding-left:7px;min-width:20px}
.cv{font-size:9px;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 18px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;box-shadow:var(--sh2)}
#toast.show{opacity:1}
/* ── Inline edit ── */
.ie{border:none;background:transparent;font-size:inherit;font-weight:inherit;color:inherit;font-family:inherit;cursor:pointer;padding:2px 4px;border-radius:4px;outline:none;width:100%}
.ie:hover{background:var(--blue-bg)}
.ie:focus{background:var(--blue-bg);border-bottom:2px solid var(--blue)}
/* ── Rec banner ── */
.rb{margin-top:10px;background:var(--amber-bg);border:1px solid #FDE68A;border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:7px;color:var(--amber);font-size:11px;font-weight:600}
/* ── Divider ── */
.div{border:none;border-top:1px solid var(--border2);margin:12px 0}
/* ── Misc ── */
.mono{font-family:var(--mono)}.mu{color:var(--muted)}.sm{font-size:11px}.xs{font-size:10px}.bo{font-weight:700}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
/* ── Empty state ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-ic{font-size:40px;margin-bottom:10px}
/* ── Print ── */
@media print{
  #hdr,#nav,#abar,.np,.mo{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  #main{padding:0;max-width:100%}
  .bf{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
@media(max-width:600px){#main{padding:12px}.st{font-size:17px}}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <div class="logo-ic">⬡</div>
    <div>
      <div class="logo-tx">PANEL DE INGENIERÍA</div>
      <div class="logo-sb">CONSTRUCCIÓN E INFRAESTRUCTURA</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="bg2 np" onclick="exportData()">⬇ Exportar datos</button>
    <label class="bg2 np" style="cursor:pointer">⬆ Importar <input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label>
    <button class="bp np" onclick="window.print()">🖨 Imprimir</button>
    <div id="wtabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
</div>

<!-- ALERTAS -->
<div id="abar"></div>

<!-- NAV -->
<div id="nav">
  <button class="nb active" onclick="sv('dashboard')">⬡ Dashboard</button>
  <button class="nb" onclick="sv('proyectos')">⬢ Proyectos</button>
  <button class="nb" onclick="sv('tareas')">☰ Tareas <span class="badge-dot" id="alertDot"></span></button>
  <button class="nb" onclick="sv('personal')">◈ Personal</button>
  <button class="nb" onclick="sv('graficas')">📊 Gráficas</button>
</div>

<!-- MAIN -->
<div id="main"></div>
<div id="toast"></div>

<!-- ═══ MODAL PROYECTO ═══ -->
<div class="mo" id="mProy">
  <div class="mb">
    <div class="mh"><span class="mt" id="mpT">Proyecto</span><button class="mc" onclick="cm('mProy')">✕</button></div>
    <div class="fi"><label>Nombre del Proyecto *</label><input id="pp_n" placeholder="Ej: Torre Residencial Sur"/></div>
    <div class="fi"><label>Cliente *</label><input id="pp_c" placeholder="Nombre del cliente"/></div>
    <div class="fi"><label>Estado</label><select id="pp_e"><option>En Progreso</option><option>Completado</option><option>Pendiente</option><option>Bloqueado</option></select></div>
    <div class="fi"><label>Prioridad</label><select id="pp_p"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
    <div class="fi"><label>Progreso: <span id="pp_pv">0</span>%</label><input id="pp_pr" type="range" min="0" max="100" value="0" oninput="document.getElementById('pp_pv').textContent=this.value"/></div>
    <div class="fi"><label>Fecha Inicio</label><input id="pp_fi" type="date"/></div>
    <div class="fi"><label>Fecha Entrega</label><input id="pp_ff" type="date"/></div>
    <div class="fi"><label>Descripción</label><textarea id="pp_d" placeholder="Descripción general..."></textarea></div>
    <button class="bp" style="width:100%" onclick="saveProy()">Guardar Proyecto</button>
  </div>
</div>

<!-- ═══ MODAL TAREA ═══ -->
<div class="mo" id="mTar">
  <div class="mb">
    <div class="mh"><span class="mt" id="mtT">Tarea</span><button class="mc" onclick="cm('mTar')">✕</button></div>
    <div class="fi"><label>Proyecto *</label><select id="tp_p"></select></div>
    <div class="fi"><label>Título *</label><input id="tp_t" placeholder="Ej: Revisión de planos estructurales"/></div>
    <div class="fi"><label>Asignado a</label><select id="tp_a"></select></div>
    <div class="fi"><label>Semana</label><select id="tp_s" id="tp_s"></select></div>
    <div class="fi"><label>Fecha Límite</label><input id="tp_dl" type="date"/></div>
    <div class="fi"><label>Estado</label><select id="tp_e"><option>Pendiente</option><option>En Progreso</option><option>Completado</option><option>Bloqueado</option></select></div>
    <div class="fi"><label>Prioridad</label><select id="tp_pr"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
    <div class="fi"><label>Notas / Descripción</label><textarea id="tp_n" placeholder="Detalles de la tarea..."></textarea></div>
    <button class="bp" style="width:100%;margin-top:4px" onclick="saveTar()">Guardar Tarea</button>
  </div>
</div>

<!-- ═══ MODAL DETALLE ═══ -->
<div class="mo" id="mDet">
  <div class="mb" style="max-width:560px">
    <div class="mh"><span class="mt">Detalle de Tarea</span><button class="mc" onclick="cm('mDet')">✕</button></div>
    <div id="detC"></div>
  </div>
</div>

<!-- ═══ MODAL PERSONAL ═══ -->
<div class="mo" id="mPer">
  <div class="mb">
    <div class="mh"><span class="mt" id="mperT">Miembro</span><button class="mc" onclick="cm('mPer')">✕</button></div>
    <div class="fi"><label>Nombre Completo *</label><input id="per_n" placeholder="Ej: Carlos Pérez"/></div>
    <div class="fi"><label>Cargo / Rol *</label><input id="per_r" placeholder="Ej: Ing. Civil Estructural"/></div>
    <div class="fi"><label>Nivel</label><select id="per_nv"><option>Gerente</option><option>Senior</option><option>Junior</option><option>Asistente</option><option>Pasante</option></select></div>
    <div class="fi"><label>Color</label><div class="cprow" id="cpick"></div></div>
    <button class="bp" style="width:100%;margin-top:8px" onclick="savePer()">Guardar Miembro</button>
  </div>
</div>

<!-- ═══ MODAL SEMANAS ═══ -->
<div class="mo" id="mSem">
  <div class="mb" style="max-width:420px">
    <div class="mh"><span class="mt">Gestionar Semanas</span><button class="mc" onclick="cm('mSem')">✕</button></div>
    <div id="semList" style="margin-bottom:14px"></div>
    <div class="fi"><label>Nueva Semana</label><input id="sem_n" placeholder="Ej: Sem 5 · 27 Ene – 31 Ene"/></div>
    <button class="bp" style="width:100%" onclick="addSem()">+ Agregar Semana</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  STORAGE KEY
// ═══════════════════════════════════════════════
const SK = 'ing_panel_v3';

// ═══════════════════════════════════════════════
//  DEFAULT DATA
// ═══════════════════════════════════════════════
const DEF = {
  semanas: ['Sem 1','Sem 2','Sem 3','Sem 4'],
  semanaActiva: 'Sem 1',
  team: [
    {id:1,nombre:'Alejandro Castro',rol:'Gerente de Ingeniería',      avatar:'AC',nivel:'Gerente',  color:'#D97706'},
    {id:2,nombre:'Anthony Jiménez', rol:'Ing. Jr. Diseño Estructural',avatar:'AJ',nivel:'Junior',   color:'#2563EB'},
    {id:3,nombre:'Ignacio Machua',  rol:'Asistente de Diseño',        avatar:'IM',nivel:'Asistente',color:'#7C3AED'},
    {id:4,nombre:'Juan José Ávila', rol:'Asistente de Diseño',        avatar:'JA',nivel:'Asistente',color:'#059669'},
  ],
  proyectos: [],
  tareas: [],
};

// ═══════════════════════════════════════════════
//  STATE — loaded from localStorage or defaults
// ═══════════════════════════════════════════════
let S = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(SK);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function saveState(){
  try{ localStorage.setItem(SK, JSON.stringify(S)); }catch(e){}
}

// ═══════════════════════════════════════════════
//  EXPORT / IMPORT
// ═══════════════════════════════════════════════
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'panel-ingenieria-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('✓ Datos exportados','#059669');
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.team || !data.proyectos) throw new Error();
      S = data;
      saveState();
      render();
      toast('✓ Datos importados correctamente','#059669');
    }catch(err){ alert('El archivo no es válido.'); }
  };
  r.readAsText(file);
  e.target.value='';
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
const EC = {'En Progreso':'#D97706','Completado':'#059669','Pendiente':'#6B7280','Bloqueado':'#DC2626'};
const EB = {'En Progreso':'#FFFBEB','Completado':'#ECFDF5','Pendiente':'#F9FAFB','Bloqueado':'#FEF2F2'};
const PC = {'Alta':'#DC2626','Media':'#D97706','Baja':'#059669'};
const PB = {'Alta':'#FEF2F2','Media':'#FFFBEB','Baja':'#ECFDF5'};
const NC = {'Gerente':'#D97706','Senior':'#DC2626','Junior':'#2563EB','Asistente':'#7C3AED','Pasante':'#059669'};
const COLORS = ['#2563EB','#7C3AED','#059669','#D97706','#DC2626','#0891B2','#DB2777','#65A30D','#EA580C','#4F46E5','#0F766E','#B45309'];

const gP = id => S.proyectos.find(p=>p.id===id);
const gM = id => S.team.find(t=>t.id===id);

function inits(n){ return n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function pts(pid){ return S.tareas.filter(t=>t.asignadoA===pid&&t.estado==='Completado').length*10; }
function stars(p){ return p>=50?5:p>=35?4:p>=20?3:p>=10?2:p>=5?1:0; }
function stH(n){ return [1,2,3,4,5].map(i=>`<span class="star ${i<=n?'on':'off'}">★</span>`).join(''); }
function bdg(l,c,b){ return `<span class="bdg" style="background:${b||c+'18'};color:${c};border:1px solid ${c}28">${l}</span>`; }
function av(ini,sz=36,col='#2563EB'){ return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.33)}px;background:${col}">${ini}</div>`; }
function bar(v,col,h=8){ return `<div class="bw" style="height:${h}px"><div class="bf" style="width:${Math.min(v,100)}%;background:${col}"></div></div>`; }
function today(){ return new Date().toISOString().split('T')[0]; }
function dL(d){ if(!d)return '—'; try{const[y,m,dd]=d.split('-');const ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return `${dd} ${ms[parseInt(m)-1]} ${y}`;}catch{return d;} }

function toast(msg,col='#059669'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// auto-progress: % based on completed tasks
function autoProgress(proyId){
  const all = S.tareas.filter(t=>t.proyectoId===proyId);
  if(!all.length) return null;
  return Math.round(all.filter(t=>t.estado==='Completado').length/all.length*100);
}

// ═══════════════════════════════════════════════
//  ALERTAS
// ═══════════════════════════════════════════════
function checkAlertas(){
  const bar=document.getElementById('abar');
  const dot=document.getElementById('alertDot');
  const td=today();
  const alerts=[];
  S.tareas.forEach(t=>{
    if(t.estado==='Bloqueado') alerts.push(`⚠ Bloqueada: "${t.titulo}"`);
    else if(t.deadline&&t.deadline<td&&t.estado!=='Completado') alerts.push(`🔴 Vencida: "${t.titulo}" (${dL(t.deadline)})`);
    else if(t.deadline&&t.deadline===td&&t.estado!=='Completado') alerts.push(`🟡 Vence hoy: "${t.titulo}"`);
  });
  if(alerts.length){
    bar.innerHTML=`<span style="color:var(--red);font-family:var(--mono);font-size:10px;font-weight:700;flex-shrink:0">🚨 ${alerts.length} ALERTA${alerts.length>1?'S':''}</span>`+alerts.map(a=>`<div class="aitem">${a}</div>`).join('');
    bar.classList.add('show');
    dot&&dot.classList.add('show');
  } else {
    bar.classList.remove('show');
    dot&&dot.classList.remove('show');
  }
}

//  WEEK TABS
// ═══════════════════════════════════════════════
function renderWTabs(){
  document.getElementById('wtabs').innerHTML =
    S.semanas.map(s=>`<button class="wt ${s===S.semanaActiva?'active':''}" onclick="setSem('${s}')">${s}</button>`).join('')
    +`<button class="wt np" onclick="om('mSem')" title="Gestionar semanas">⚙</button>`;
}
function setSem(s){ S.semanaActiva=s; saveState(); renderWTabs(); render(); }

// ═══════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════
let vista='dashboard';
function sv(v){
  vista=v;
  const keys=['dashboard','proyectos','tareas','personal','graficas'];
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('active',keys[i]===v));
  render();
}

// ═══════════════════════════════════════════════
//  RENDER DISPATCHER
// ═══════════════════════════════════════════════
function render(){
  checkAlertas();
  const m=document.getElementById('main');
  if(vista==='dashboard')  m.innerHTML=rDash();
  else if(vista==='proyectos') m.innerHTML=rProy();
  else if(vista==='tareas')    m.innerHTML=rTar();
  else if(vista==='personal')  m.innerHTML=rPer();
  else if(vista==='graficas')  m.innerHTML=rGraf();
}

  const comp=sem.filter(t=>t.estado==='Completado').length;
  const bloq=S.tareas.filter(t=>t.estado==='Bloqueado').length;
  const activos=S.proyectos.filter(p=>p.estado==='En Progreso').length;

  const kpis=[
    {l:'Proyectos Activos',v:activos,i:'⬢',c:'#2563EB',bg:'#EFF6FF'},
    {l:'Tareas '+S.semanaActiva,v:sem.length,i:'☰',c:'#D97706',bg:'#FFFBEB'},
    {l:'Completadas',v:comp,i:'✓',c:'#059669',bg:'#ECFDF5'},

    <div class="kpi-ic" style="color:${k.c}">${k.i}</div>
    <div class="kpi-v" style="color:${k.c}">${k.v}</div>
    <div class="kpi-l" style="color:${k.c}99">${k.l}</div>
  </div>`).join('');

  const prows = S.proyectos.length ? S.proyectos.map(p=>{
    const ap=autoProgress(p.id); const prog=ap!==null?ap:p.progreso;
    const pc=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    const members=[...new Set(S.tareas.filter(t=>t.proyectoId===p.id).map(t=>t.asignadoA))]
      .map(id=>{const m=gM(id);return m?av(m.avatar,22,m.color):'';}).join('');
    return `<div class="card mb12">
      <div class="row mb8" style="justify-content:space-between">
        <div><div class="bo" style="font-size:13px">${p.nombre}</div><div class="mu xs mono">${p.cliente||''}</div></div>
        <div class="row">${bdg(p.prioridad,PC[p.prioridad],PB[p.prioridad])}${bdg(p.estado,EC[p.estado],EB[p.estado])}<span style="color:${pc};font-family:var(--mono);font-weight:800;font-size:16px">${prog}%</span></div>
      </div>
      ${bar(prog,pc,9)}
      <div class="row" style="justify-content:space-between;margin-top:7px">
        <div class="row" style="gap:3px">${members}</div>
        <span class="xs mu mono">Entrega: ${dL(p.fechaFin)}</span>
      </div>
    </div>`;
  }).join('') : `<div class="card empty"><div class="empty-ic">📁</div><div>Sin proyectos aún.</div><button class="bp" style="margin-top:12px" onclick="sv('proyectos')">Crear primer proyecto</button></div>`;

  const teamH=S.team.map(m=>{
    const p=pts(m.id);const s=stars(p);
    const tot=S.tareas.filter(t=>t.asignadoA===m.id).length;
    const c=S.tareas.filter(t=>t.asignadoA===m.id&&t.estado==='Completado').length;
    return `<div class="card">
      <div class="row mb8">${av(m.avatar,34,m.color)}<div><div class="bo sm">${m.nombre}</div><div class="mu xs mono">${m.rol}</div></div></div>
      <div class="row mb6">${stH(s)}<span class="mu xs mono" style="margin-left:3px">${p} pts</span></div>
      <div class="mu xs mono mb6">${c}/${tot} completadas</div>
      ${bar(tot>0?(c/tot)*100:0,m.color,5)}
    </div>`;
  }).join('');

  return `<div class="ey">RESUMEN EJECUTIVO</div>
  <div class="st">Panel de Control — ${S.semanaActiva}</div>
  <div class="g4 mb20">${kpis}</div>
  <div class="ey mb8">AVANCE DE PROYECTOS</div>
  <div class="mb20">${prows}</div>

// ═══════════════════════════════════════════════
//  TAREAS
// ═══════════════════════════════════════════════
function rTar(){
  const td=today();
  const sem=S.tareas.filter(t=>t.semana===S.semanaActiva);
  let html=`<div class="row mb20" style="justify-content:space-between">
    <div><div class="ey">SEGUIMIENTO · ${S.semanaActiva}</div><div class="st" style="margin-bottom:0">Tareas del Equipo</div></div>
    <button class="bp np" onclick="oMT()">+ Nueva Tarea</button>
  </div>`;

  let hayTareas=false;
  S.team.forEach(m=>{
    const tm=sem.filter(t=>t.asignadoA===m.id);
    if(!tm.length) return;
    hayTareas=true;
    const rows=tm.map(t=>{
      const proy=gP(t.proyectoId);
      const venc=t.deadline&&t.deadline<td&&t.estado!=='Completado';
      const opts=['Pendiente','En Progreso','Completado','Bloqueado'].map(e=>`<option value="${e}" ${t.estado===e?'selected':''}>${e}</option>`).join('');
      return `<div class="card row mb8" style="flex-wrap:wrap;${venc?'border-color:#FECACA;background:#FEF9F9;':''}">
        <div style="flex:1;min-width:160px">
          <div class="bo sm mb4">${t.titulo}${venc?` <span style="color:var(--red);font-size:9px;font-family:var(--mono)">VENCIDA</span>`:''}</div>
          <div class="mu xs mono">${proy?proy.nombre:'—'}${t.deadline?' · '+dL(t.deadline):''}</div>
          ${t.notas?`<div class="xs mu" style="margin-top:3px;font-style:italic">${t.notas.slice(0,80)}${t.notas.length>80?'…':''}</div>`:''}
          ${t.comentarios?.length?`<div class="xs mono" style="color:var(--blue);margin-top:3px">💬 ${t.comentarios.length}</div>`:''}
        </div>
        <div class="row np" style="gap:5px;flex-wrap:wrap">
          ${bdg(t.prioridad,PC[t.prioridad],PB[t.prioridad])}
          <select class="ss" onchange="changeEst(${t.id},this.value)" style="background:${EB[t.estado]};border-color:${EC[t.estado]}50;color:${EC[t.estado]}">${opts}</select>
          <button class="bs" onclick="oMT(${t.id})">✏</button>
          <button class="bs" onclick="oDet(${t.id})">👁</button>
          <button class="bd" onclick="delTar(${t.id})">✕</button>
        </div>
      </div>`;
    }).join('');
    html+=`<div class="mb16">
      <div class="row mb8">${av(m.avatar,28,m.color)}<span class="bo sm">${m.nombre}</span><span class="mu xs mono">— ${m.rol}</span></div>
      ${rows}
    </div>`;
  });

  if(!hayTareas) html+=`<div class="card empty"><div class="empty-ic">📋</div><div>Sin tareas para ${S.semanaActiva}.</div><button class="bp np" style="margin-top:12px" onclick="oMT()">Crear tarea</button></div>`;
  return html;
}

            ${[['✓',comp,'#059669','#ECFDF5'],['▶',enP,'#D97706','#FFFBEB'],['⏸',pend,'#6B7280','#F9FAFB'],['⚠',bloq,'#DC2626','#FEF2F2']].map(([i,v,c,bg])=>`

  return `<div class="row mb20" style="justify-content:space-between">

// ═══════════════════════════════════════════════
//  GRÁFICAS
// ═══════════════════════════════════════════════
function rGraf(){
  const proyB=S.proyectos.length?S.proyectos.map(p=>{
    const ap=autoProgress(p.id);const prog=ap!==null?ap:p.progreso;
    const c=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    return `<div class="cbh"><div class="cl">${p.nombre.slice(0,20)}</div><div class="ct"><div class="cf" style="width:${prog}%;background:${c}"><span class="cv">${prog}%</span></div></div></div>`;
  }).join(''):`<div class="mu xs mono">Sin proyectos.</div>`;

  const perB=S.team.map(m=>{
    const tot=S.tareas.filter(t=>t.asignadoA===m.id).length;
    const comp=S.tareas.filter(t=>t.asignadoA===m.id&&t.estado==='Completado').length;
    const pct=tot>0?Math.round((comp/tot)*100):0;
    return `<div class="cbh"><div class="cl">${m.nombre.split(' ')[0]}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${m.color}"><span class="cv">${pct}%</span></div></div></div>`;
  }).join('');

  const totT=S.tareas.length||1;
  const estB=['Completado','En Progreso','Pendiente','Bloqueado'].map(e=>{
    const n=S.tareas.filter(t=>t.estado===e).length;
    const pct=Math.round((n/totT)*100);
    return `<div class="cbh"><div class="cl">${e}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${EC[e]}"><span class="cv">${n} (${pct}%)</span></div></div></div>`;
  }).join('');

  const semB=S.semanas.map(s=>{
    const n=S.tareas.filter(t=>t.semana===s).length;
    const c=S.tareas.filter(t=>t.semana===s&&t.estado==='Completado').length;
    const pct=n>0?Math.round((c/n)*100):0;
    return `<div class="cbh"><div class="cl">${s}</div><div class="ct"><div class="cf" style="width:${pct}%;background:#059669"><span class="cv">${c}/${n}</span></div></div></div>`;
  }).join('');

  const ptsB=S.team.map(m=>{
    const p=pts(m.id);const pct=Math.min(Math.round((p/60)*100),100);
    return `<div class="cbh"><div class="cl">${m.nombre.split(' ')[0]}</div><div class="ct"><div class="cf" style="width:${pct}%;background:${m.color}"><span class="cv">${p} pts</span></div></div></div>`;
  }).join('');

  return `<div class="ey">ANÁLISIS</div><div class="st">Gráficas de Progreso</div>
  <div class="g3">
    <div class="card"><div class="bo mb12 sm" style="color:var(--blue)">📊 Avance por Proyecto</div>${proyB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:var(--blue)">👤 Cumplimiento por Persona</div>${perB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:var(--blue)">📋 Tareas por Estado</div>${estB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:var(--blue)">📅 Por Semana</div>${semB}</div>
    <div class="card"><div class="bo mb12 sm" style="color:var(--blue)">⭐ Puntos por Persona</div>${ptsB}</div>
  </div>`;
}

// ═══════════════════════════════════════════════
//  MODAL PROYECTO
// ═══════════════════════════════════════════════
let _ePid=null;
function oMP(id=null){
  _ePid=id;
  const p=id?gP(id):null;
  document.getElementById('mpT').textContent=id?'Editar Proyecto':'Nuevo Proyecto';
  document.getElementById('pp_n').value =p?.nombre   ||'';
  document.getElementById('pp_c').value =p?.cliente  ||'';
  document.getElementById('pp_e').value =p?.estado   ||'En Progreso';
  document.getElementById('pp_p').value =p?.prioridad||'Alta';
  const pr=p?.progreso??0;
  document.getElementById('pp_pr').value=pr;
  document.getElementById('pp_pv').textContent=pr;
  document.getElementById('pp_fi').value=p?.fechaInicio||'';
  document.getElementById('pp_ff').value=p?.fechaFin   ||'';
  document.getElementById('pp_d').value =p?.desc       ||'';
  om('mProy');
}
function saveProy(){
  const d={
    nombre:document.getElementById('pp_n').value.trim(),
    cliente:document.getElementById('pp_c').value.trim(),
    estado:document.getElementById('pp_e').value,
    prioridad:document.getElementById('pp_p').value,
    progreso:parseInt(document.getElementById('pp_pr').value)||0,
    fechaInicio:document.getElementById('pp_fi').value,
    fechaFin:document.getElementById('pp_ff').value,
    desc:document.getElementById('pp_d').value.trim()
  };
  if(!d.nombre){alert('El nombre es requerido.');return;}
  if(_ePid){S.proyectos=S.proyectos.map(p=>p.id===_ePid?{...p,...d}:p);toast('✓ Proyecto actualizado');}
  else{S.proyectos.push({id:Date.now(),...d});toast('✓ Proyecto creado');}
  saveState();cm('mProy');render();
}
function delProy(id){
  const p=gP(id);
  if(!confirm(`¿Eliminar "${p?.nombre}"? Las tareas asociadas también se eliminarán.`)) return;
  S.proyectos=S.proyectos.filter(p=>p.id!==id);
  S.tareas=S.tareas.filter(t=>t.proyectoId!==id);
  saveState();render();toast('✓ Proyecto eliminado','#DC2626');
}

// ═══════════════════════════════════════════════
//  MODAL TAREA
// ═══════════════════════════════════════════════
let _eTid=null;
function oMT(id=null){
  _eTid=id;
  const t=id?S.tareas.find(x=>x.id===id):null;
  document.getElementById('mtT').textContent=id?'Editar Tarea':'Nueva Tarea';
  document.getElementById('tp_p').innerHTML=S.proyectos.map(p=>`<option value="${p.id}" ${t?.proyectoId===p.id?'selected':''}>${p.nombre}</option>`).join('');
  document.getElementById('tp_a').innerHTML=S.team.map(m=>`<option value="${m.id}" ${t?.asignadoA===m.id?'selected':''}>${m.nombre}</option>`).join('');
  document.getElementById('tp_s').innerHTML=S.semanas.map(s=>`<option value="${s}" ${(t?.semana||S.semanaActiva)===s?'selected':''}>${s}</option>`).join('');
  document.getElementById('tp_t').value =t?.titulo   ||'';
  document.getElementById('tp_dl').value=t?.deadline ||'';
  document.getElementById('tp_e').value =t?.estado   ||'Pendiente';
  document.getElementById('tp_pr').value=t?.prioridad||'Media';
  document.getElementById('tp_n').value =t?.notas    ||'';
  om('mTar');
}
function saveTar(){
  const d={
    proyectoId:parseInt(document.getElementById('tp_p').value)||0,
    titulo:document.getElementById('tp_t').value.trim(),
    asignadoA:parseInt(document.getElementById('tp_a').value)||0,
    semana:document.getElementById('tp_s').value,
    deadline:document.getElementById('tp_dl').value,
    estado:document.getElementById('tp_e').value,
    prioridad:document.getElementById('tp_pr').value,
    notas:document.getElementById('tp_n').value.trim()
  };
  if(!d.titulo){alert('El título es requerido.');return;}
  if(_eTid){
    const old=S.tareas.find(t=>t.id===_eTid);
    const hist=[...(old.historial||[])];
    if(old.estado!==d.estado) hist.push({estado:d.estado,fecha:today(),autor:'Alejandro Castro'});
    S.tareas=S.tareas.map(t=>t.id===_eTid?{...t,...d,historial:hist}:t);
    toast('✓ Tarea actualizada');
  } else {
    S.tareas.push({id:Date.now(),...d,comentarios:[],historial:[{estado:d.estado,fecha:today(),autor:'Alejandro Castro'}]});
    toast('✓ Tarea creada');
  }
  saveState();cm('mTar');render();
}
function changeEst(id,estado){
  S.tareas=S.tareas.map(t=>{
    if(t.id!==id) return t;
    const hist=[...(t.historial||[]),{estado,fecha:today(),autor:'Alejandro Castro'}];
    return {...t,estado,historial:hist};
  });
  saveState();toast('✓ Estado actualizado');render();
}
function delTar(id){
  const t=S.tareas.find(x=>x.id===id);
  if(!confirm(`¿Eliminar tarea "${t?.titulo}"?`)) return;
  S.tareas=S.tareas.filter(x=>x.id!==id);
  saveState();render();toast('✓ Tarea eliminada','#DC2626');
}

// ═══════════════════════════════════════════════
//  DETALLE TAREA
// ═══════════════════════════════════════════════
function oDet(id){
  const t=S.tareas.find(x=>x.id===id);if(!t)return;
  const proy=gP(t.proyectoId);const pers=gM(t.asignadoA);
  const hist=(t.historial||[]).slice().reverse().map(h=>
    `<div class="hi"><div class="hd" style="background:${EC[h.estado]||'#6B7280'}"></div>
    <div><div class="sm bo mono" style="color:${EC[h.estado]||'#6B7280'}">${h.estado}</div>
    <div class="xs mu mono">${h.autor} · ${dL(h.fecha)}</div></div></div>`).join('');
  const coms=(t.comentarios||[]).map(c=>
    `<div class="ci"><div class="cm">${c.autor} · ${dL(c.fecha)}</div><div class="sm">${c.texto}</div></div>`).join('');
  document.getElementById('detC').innerHTML=`
    <div class="row mb10">${bdg(t.estado,EC[t.estado],EB[t.estado])}${bdg(t.prioridad,PC[t.prioridad],PB[t.prioridad])}</div>
    <div class="bo" style="font-size:15px;margin-bottom:3px">${t.titulo}</div>
    <div class="mu xs mono mb10">${proy?.nombre||'—'} · ${t.semana}${t.deadline?' · '+dL(t.deadline):''}</div>
    <div class="row mb12">${av(pers?.avatar||'?',28,pers?.color||'#2563EB')}<div><div class="sm bo">${pers?.nombre||'—'}</div><div class="xs mu mono">${pers?.rol||''}</div></div></div>
    ${t.notas?`<div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px;font-size:12px;font-style:italic;color:var(--text3);margin-bottom:12px">${t.notas}</div>`:''}
    <button class="bp np mb12" onclick="cm('mDet');oMT(${t.id})">✏ Editar tarea</button>
    <div class="div"></div>
    <div class="bo xs mono mb8" style="color:var(--blue)">💬 Comentarios</div>
    ${coms||'<div class="xs mu mono mb8">Sin comentarios.</div>'}
    <div class="fi np"><label>Agregar comentario</label><textarea id="newc" placeholder="Escribe tu comentario..."></textarea></div>
    <button class="bp np" style="width:100%;margin-bottom:14px" onclick="addComment(${t.id})">Agregar</button>
    <div class="div"></div>
    <div class="bo xs mono mb8" style="color:var(--blue)">📋 Historial</div>
    ${hist||'<div class="xs mu mono">Sin historial.</div>'}`;
  om('mDet');
}
function addComment(tid){
  const txt=document.getElementById('newc').value.trim();if(!txt)return;
  S.tareas=S.tareas.map(t=>{
    if(t.id!==tid)return t;
    return {...t,comentarios:[...(t.comentarios||[]),{autor:'Alejandro Castro',texto:txt,fecha:today()}]};
  });
  saveState();toast('✓ Comentario agregado');oDet(tid);
}

// ═══════════════════════════════════════════════
//  MODAL PERSONAL
// ═══════════════════════════════════════════════
let _ePer=null,_col=COLORS[0];
function buildCP(sel){
  _col=sel;
  document.getElementById('cpick').innerHTML=COLORS.map(c=>
    `<div class="co ${c===sel?'sel':''}" style="background:${c}" onclick="selColor('${c}')"></div>`).join('');
}
function selColor(c){
  _col=c;
  document.querySelectorAll('.co').forEach(el=>el.classList.toggle('sel',el.style.background===c||el.style.backgroundColor===c));
}
function oMPer(id=null){
  _ePer=id;
  const m=id?gM(id):null;
  document.getElementById('mperT').textContent=id?'Editar Miembro':'Nuevo Miembro';
  document.getElementById('per_n').value =m?.nombre||'';
  document.getElementById('per_r').value =m?.rol   ||'';
  document.getElementById('per_nv').value=m?.nivel ||'Junior';
  buildCP(m?.color||COLORS[0]);
  om('mPer');
}
function savePer(){
  const nombre=document.getElementById('per_n').value.trim();
  const rol=document.getElementById('per_r').value.trim();
  const nivel=document.getElementById('per_nv').value;
  if(!nombre||!rol){alert('Nombre y cargo son requeridos.');return;}
  const avatar=inits(nombre);
  if(_ePer){
    S.team=S.team.map(m=>m.id===_ePer?{...m,nombre,rol,nivel,color:_col,avatar}:m);
    toast('✓ Miembro actualizado');
  } else {
    S.team.push({id:Date.now(),nombre,rol,avatar,nivel,color:_col});
    toast('✓ Miembro agregado');
  }
  saveState();cm('mPer');render();
}
function delPer(id){
  const m=gM(id);if(!m)return;
  const msg=S.tareas.some(t=>t.asignadoA===id)
    ?`¿Eliminar a ${m.nombre}? Tiene tareas asignadas que quedarán sin responsable.`
    :`¿Eliminar a ${m.nombre} del equipo?`;
  if(!confirm(msg))return;
  S.team=S.team.filter(t=>t.id!==id);
  saveState();toast('✓ Eliminado','#DC2626');render();
}

// ═══════════════════════════════════════════════
//  MODAL SEMANAS
// ═══════════════════════════════════════════════
function renderSemList(){
  document.getElementById('semList').innerHTML=S.semanas.map((s,i)=>
    `<div class="row mb8" style="justify-content:space-between">
      <span class="sm mono">${s}</span>
      <div class="row" style="gap:5px">
        ${S.semanaActiva===s?`<span class="bdg" style="background:var(--blue-bg);color:var(--blue);border:1px solid #BFDBFE">Activa</span>`:'<button class="bs" style="font-size:10px" onclick="setSem(\''+s+'\');renderSemList()">Activar</button>'}
        ${S.semanas.length>1?`<button class="bd" style="font-size:10px" onclick="delSem(${i})">✕</button>`:''}
      </div>
    </div>`).join('');
}
function addSem(){
  const v=document.getElementById('sem_n').value.trim();
  if(!v)return;
  if(S.semanas.includes(v)){alert('Ya existe esa semana.');return;}
  S.semanas.push(v);
  document.getElementById('sem_n').value='';
  saveState();renderWTabs();renderSemList();toast('✓ Semana agregada');
}
function delSem(i){
  const s=S.semanas[i];
  if(S.semanaActiva===s){alert('No puedes eliminar la semana activa.');return;}
  if(!confirm(`¿Eliminar "${s}"? Las tareas de esa semana no se borrarán.`))return;
  S.semanas.splice(i,1);
  saveState();renderWTabs();renderSemList();toast('✓ Semana eliminada','#DC2626');
}

// ═══════════════════════════════════════════════
//  MODAL UTILS
// ═══════════════════════════════════════════════
function om(id){
  document.getElementById(id).classList.add('open');
  if(id==='mSem') renderSemList();
}
function cm(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.mo').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mo.open').forEach(m=>m.classList.remove('open'));});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
renderWTabs();
render();
</script>
</body>
</html>
