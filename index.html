<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elmufdi Construcciones — Panel de Ingeniería</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;--surface:#fff;--card:#fff;--border:#C5D0E0;--border2:#DDE5EF;
  --blue:#1E3A6E;--blue-lt:#2B5298;--blue-bg:#EBF0F8;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --green:#059669;--green-bg:#ECFDF5;
  --red:#DC2626;--red-bg:#FEF2F2;
  --purple:#7C3AED;
  --muted:#6B7280;--muted2:#9CA3AF;--muted3:#E5E7EB;
  --text:#111827;--text2:#374151;--text3:#6B7280;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --mono:'Courier New',Courier,monospace;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
#hdr{background:#1E3A6E;border-bottom:1px solid #162d57;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(30,58,110,.4)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{height:36px;width:auto;border-radius:4px;background:#fff;padding:2px 6px}
.logo-tx{font-weight:800;font-size:13px;color:#fff;letter-spacing:.3px}
.logo-sb{color:#A8BFDE;font-size:8px;font-family:var(--mono);letter-spacing:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#abar{display:none;background:#FEF2F2;border-bottom:2px solid #FECACA;padding:6px 20px;gap:8px;flex-wrap:wrap;align-items:center}
#abar.show{display:flex}
.aitem{background:#FEE2E2;border:1px solid #FECACA;border-radius:5px;padding:3px 9px;font-size:11px;font-family:var(--mono);color:var(--red)}
#nav{display:flex;gap:2px;padding:4px 20px;background:#F4F7FC;border-bottom:2px solid #1E3A6E;overflow-x:auto}
.nb{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;white-space:nowrap;transition:all .15s}
.nb.active{color:#1E3A6E;font-weight:700;border-bottom-color:#1E3A6E;background:var(--blue-bg)}
.nb:hover:not(.active){background:var(--blue-bg);color:#1E3A6E}
.nb .bdot{width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:2px;display:none}
.nb .bdot.show{display:inline-block}
#main{padding:20px;max-width:1160px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--sh)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kpi{text-align:center;padding:16px 10px}
.kpi-v{font-size:28px;font-weight:900;font-family:var(--mono)}
.kpi-l{font-size:9px;font-family:var(--mono);margin-top:3px;letter-spacing:.5px}
.bw{background:var(--muted3);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;transition:width .5s}
.bdg{border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap;display:inline-block}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--mono);flex-shrink:0}
.ey{color:#1E3A6E;font-family:var(--mono);font-size:9px;letter-spacing:3px;margin-bottom:3px;font-weight:700}
.st{font-size:20px;font-weight:800;margin-bottom:18px;color:var(--text)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.star{font-size:14px}.star.on{color:#F59E0B}.star.off{color:#D1D5DB}
.bp{background:linear-gradient(135deg,#1E3A6E,#2B5298);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;transition:all .15s;box-shadow:0 2px 6px rgba(30,58,110,.3);white-space:nowrap}
.bp:hover{opacity:.9}
.bp2{background:linear-gradient(135deg,#D97706,#F59E0B);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}
.bs{background:#fff;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .15s;box-shadow:var(--sh);white-space:nowrap}
.bs:hover{border-color:#1E3A6E;color:#1E3A6E;background:var(--blue-bg)}
.bd{background:var(--red-bg);border:1px solid #FECACA;color:var(--red);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:var(--mono);white-space:nowrap}
.bg2{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-size:11px;font-family:var(--mono);font-weight:700}
.wt{padding:4px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#A8BFDE;cursor:pointer;font-size:10px;font-family:var(--mono);font-weight:700;transition:all .15s;white-space:nowrap}
.wt.active{border-color:#fff;background:rgba(255,255,255,.2);color:#fff}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mo.open{display:flex}
.mb{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{color:#1E3A6E;font-weight:800;font-size:15px}
.mc{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:2px 6px;border-radius:5px}
.mc:hover{background:var(--bg)}
.fi{margin-bottom:12px}
.fi label{color:var(--text2);font-size:11px;font-family:var(--mono);display:block;margin-bottom:4px;font-weight:700}
.fi input,.fi select,.fi textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-size:12px;font-family:var(--mono);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:#1E3A6E}
.fi textarea{resize:vertical;min-height:65px}
.fi input[type=range]{padding:4px 0;cursor:pointer}
.cprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.co{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.co.sel{border-color:#111;transform:scale(1.2)}
select.ss{border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;border-width:1.5px;border-style:solid}
.hi{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2);align-items:flex-start}
.hd{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ci{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:7px}
.cm2{color:var(--muted2);font-size:9px;font-family:var(--mono);margin-bottom:3px}
.cbh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cl{font-size:10px;font-family:var(--mono);color:var(--text3);width:130px;flex-shrink:0;text-align:right}
.ct{flex:1;background:var(--muted3);border-radius:99px;height:18px;overflow:hidden}
.cf{height:100%;border-radius:99px;transition:width .6s;display:flex;align-items:center;padding-left:7px;min-width:20px}
.cv{font-size:9px;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
#toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 18px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;box-shadow:var(--sh2)}
#toast.show{opacity:1}
.rb{margin-top:10px;background:var(--amber-bg);border:1px solid #FDE68A;border-radius:7px;padding:8px 12px;display:flex;align-items:center;gap:7px;color:var(--amber);font-size:11px;font-weight:600}
.div2{border:none;border-top:1px solid var(--border2);margin:12px 0}
.mono{font-family:var(--mono)}.mu{color:var(--muted)}.sm{font-size:11px}.xs{font-size:10px}.bo{font-weight:700}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
.sem-check{display:flex;align-items:center;gap:6px;background:#F8FAFC;border:1.5px solid var(--border);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:var(--mono);transition:all .15s;user-select:none}
.sem-check.active{background:var(--blue-bg);border-color:#1E3A6E;color:#1E3A6E}
.ger-badge{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;font-family:var(--mono)}
/* Report styles */
#rCont{display:none;padding:20px;max-width:900px;margin:0 auto}
.r-hdr{background:#1E3A6E;color:#fff;padding:16px 22px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-logo{height:40px;width:auto;border-radius:4px;background:#fff;padding:3px 7px}
.r-title{font-size:17px;font-weight:800}
.r-sub{font-size:10px;color:#A8BFDE;letter-spacing:1px;margin-top:2px;font-family:var(--mono)}
.r-week{font-size:16px;font-weight:700;text-align:right}
.r-date{font-size:10px;color:#A8BFDE;margin-top:2px}
.r-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.r-kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;border-top:3px solid #1E3A6E}
.r-kpi-v{font-size:22px;font-weight:900;font-family:var(--mono);color:#1E3A6E}
.r-kpi-l{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.r-sec{font-size:9px;font-weight:700;font-family:var(--mono);color:#1E3A6E;letter-spacing:3px;margin:12px 0 8px;border-bottom:2px solid #1E3A6E;padding-bottom:4px}
.rcard{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.r-ph{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border2)}
.r-pn{font-weight:700;font-size:13px;color:var(--text)}
.r-pr{font-size:10px;color:var(--muted);font-family:var(--mono)}
.r-task{padding:8px 0;border-bottom:1px solid #F0F4F8}
.r-task:last-child{border-bottom:none}
.r-task-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.r-tt{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.r-tm{font-size:10px;color:var(--muted);font-family:var(--mono)}
.r-pbar{width:100%;background:#E5E7EB;border-radius:4px;height:10px;overflow:hidden;margin-top:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-pfill{height:10px;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-proy-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F0F4F8}
.r-proy-row:last-child{border-bottom:none}
.r-proy-name{font-size:12px;font-weight:600;min-width:160px}
.r-pbar2{flex:1;background:#E5E7EB;border-radius:99px;height:10px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-pfill2{height:100%;border-radius:99px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-pct{font-size:11px;font-weight:700;font-family:var(--mono);color:#1E3A6E;min-width:36px;text-align:right}
.r-footer{margin-top:20px;padding-top:10px;border-top:2px solid #1E3A6E;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.r-fl{font-size:10px;color:var(--muted);font-family:var(--mono)}
.r-fr{font-size:10px;color:#1E3A6E;font-family:var(--mono);font-weight:700}
.r-ctrl{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.r-back{background:#fff;border:1.5px solid #1E3A6E;color:#1E3A6E;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:12px;font-family:var(--mono)}
.bono-item{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:6px;padding:7px 10px;margin-bottom:5px;font-size:11px}
.bono-pts{font-weight:700;color:var(--amber)}
.bono-nota{color:var(--text3);margin-top:2px}
@media print{
  #hdr,#nav,#abar,.np,#main,.mo{display:none!important}
  #rCont{display:block!important;padding:0}
  body{background:#fff}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .rcard{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .r-ctrl{display:none!important}
  @page{margin:12mm 12mm 18mm 12mm;size:A4}
  @page{@bottom-center{content:"Página " counter(page) " de " counter(pages);font-family:'Courier New',monospace;font-size:9pt;color:#6B7280}}
}
@media(max-width:600px){#main{padding:12px}.st{font-size:17px}}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo">
    <img id="logoImg" class="logo-ic" src="" alt="Elmufdi"/>
    <div><div class="logo-tx">ELMUFDI CONSTRUCCIONES</div><div class="logo-sb">DEPARTAMENTO DE INGENIERÍA</div></div>
  </div>
  <div class="hdr-right">
    <button class="bg2 np" onclick="exportData()">⬇ Exportar</button>
    <label class="bg2 np" style="cursor:pointer">⬆ Importar<input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label>
    <button class="bg2 np" onclick="window.print()">🖨 Imprimir</button>
    <div id="wtabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
  </div>
</div>
<div id="abar"></div>
<div id="nav">
  <button class="nb active" onclick="sv('dashboard')">⬡ Dashboard</button>
  <button class="nb" onclick="sv('proyectos')">⬢ Proyectos</button>
  <button class="nb" onclick="sv('tareas')">☰ Tareas <span class="bdot" id="aDot"></span></button>
  <button class="nb" onclick="sv('personal')">◈ Personal</button>
  <button class="nb" onclick="sv('graficas')">📊 Gráficas</button>
  <button class="nb" onclick="openReport()" style="border-left:2px solid #C5D0E0;margin-left:4px">📄 Reporte</button>
</div>
<div id="main"></div>
<div id="rCont">
  <div class="r-ctrl np">
    <button class="r-back" onclick="closeReport()">← Volver</button>
    <button class="bp np" onclick="window.print()">🖨 Imprimir / PDF</button>
    <button class="bp2 np" onclick="shareWA()">📱 Compartir resumen</button>
  </div>
  <div id="rBody"></div>
</div>
<div id="toast"></div>

<!-- MODAL PROYECTO -->
<div class="mo" id="mProy">
  <div class="mb">
    <div class="mh"><span class="mt" id="mpT">Proyecto</span><button class="mc" onclick="cm('mProy')">✕</button></div>
    <div class="fi"><label>Nombre *</label><input id="pp_n" placeholder="Ej: Torre Residencial"/></div>
    <div class="fi"><label>Cliente</label><input id="pp_c" placeholder="Nombre del cliente"/></div>
    <div class="fi"><label>Estado</label><select id="pp_e"><option>En Progreso</option><option>Completado</option><option>Pendiente</option><option>Bloqueado</option></select></div>
    <div class="fi"><label>Prioridad</label><select id="pp_p"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
    <div class="fi"><label>Progreso: <span id="pp_pv">0</span>%</label><input id="pp_pr" type="range" min="0" max="100" value="0" oninput="document.getElementById('pp_pv').textContent=this.value"/></div>
    <div class="fi"><label>Fecha Inicio</label><input id="pp_fi" type="date"/></div>
    <div class="fi"><label>Fecha Entrega</label><input id="pp_ff" type="date"/></div>
    <div class="fi"><label>Descripción</label><textarea id="pp_d" placeholder="Descripción general..."></textarea></div>
    <button class="bp" style="width:100%" onclick="saveProy()">Guardar Proyecto</button>
  </div>
</div>

<!-- MODAL TAREA -->
<div class="mo" id="mTar">
  <div class="mb">
    <div class="mh"><span class="mt" id="mtT">Tarea</span><button class="mc" onclick="cm('mTar')">✕</button></div>
    <div class="fi"><label>Proyecto</label><select id="tp_p"></select></div>
    <div class="fi"><label>Título *</label><input id="tp_t" placeholder="Ej: Revisión de planos"/></div>
    <div class="fi"><label>Asignado a</label><select id="tp_a"></select></div>
    <div class="fi"><label>Semanas <span style="color:#1E3A6E;font-size:10px;font-weight:400">— Selecciona una o varias</span></label><div id="tp_sc" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px"></div></div>
    <div class="fi"><label>Fecha Límite</label><input id="tp_dl" type="date"/></div>
    <div class="fi"><label>Estado</label><select id="tp_e"><option>Pendiente</option><option>En Progreso</option><option>Completado</option><option>Bloqueado</option></select></div>
    <div class="fi"><label>Prioridad</label><select id="tp_pr"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
    <div class="fi"><label>Complejidad</label>
      <select id="tp_cx">
        <option value="basica">🟢 Básica — Revisiones simples (5 pts)</option>
        <option value="intermedia" selected>🟡 Intermedia — Planos, memorias (15 pts)</option>
        <option value="alta">🔴 Alta — Diseños estructurales (30 pts)</option>
        <option value="critica">🚀 Crítica — Alta responsabilidad (50 pts)</option>
      </select>
    </div>
    <div class="fi"><label>Avance: <span id="tp_av_v">0</span>%</label><input id="tp_av" type="range" min="0" max="100" value="0" oninput="document.getElementById('tp_av_v').textContent=this.value"/></div>
    <div class="fi"><label>Notas</label><textarea id="tp_n" placeholder="Descripción detallada..."></textarea></div>
    <button class="bp" style="width:100%;margin-top:4px" onclick="saveTar()">Guardar Tarea</button>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="mo" id="mDet">
  <div class="mb" style="max-width:560px">
    <div class="mh"><span class="mt">Detalle de Tarea</span><button class="mc" onclick="cm('mDet')">✕</button></div>
    <div id="detC"></div>
  </div>
</div>

<!-- MODAL PERSONAL -->
<div class="mo" id="mPer">
  <div class="mb">
    <div class="mh"><span class="mt" id="mperT">Miembro</span><button class="mc" onclick="cm('mPer')">✕</button></div>
    <div class="fi"><label>Nombre *</label><input id="per_n" placeholder="Ej: Carlos Pérez"/></div>
    <div class="fi"><label>Cargo *</label><input id="per_r" placeholder="Ej: Ing. Civil Estructural"/></div>
    <div class="fi"><label>Nivel</label><select id="per_nv"><option>Gerente</option><option>Senior</option><option>Junior</option><option>Asistente</option><option>Pasante</option></select></div>
    <div class="fi"><label>Color</label><div class="cprow" id="cpick"></div></div>
    <div class="fi"><label>¿Es Gerente/Evaluador? <span style="font-size:10px;color:var(--muted);font-weight:400">(excluye de puntos y estrellas)</span></label>
      <select id="per_ger"><option value="0">No — Miembro del equipo</option><option value="1">Sí — Evaluador/Gerente</option></select>
    </div>
    <button class="bp" style="width:100%;margin-top:8px" onclick="savePer()">Guardar Miembro</button>
  </div>
</div>

<!-- MODAL BONIFICACION -->
<div class="mo" id="mBono">
  <div class="mb" style="max-width:440px">
    <div class="mh"><span class="mt">🏆 Otorgar Bonificación</span><button class="mc" onclick="cm('mBono')">✕</button></div>
    <div style="background:var(--amber-bg);border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--amber);font-weight:600">Como Gerente puedes otorgar puntos adicionales con una nota de reconocimiento.</div>
    <div class="fi"><label>Miembro</label><select id="bon_p"></select></div>
    <div class="fi"><label>Puntos</label>
      <select id="bon_pts">
        <option value="5">+5 pts — Mención especial</option>
        <option value="10">+10 pts — Buen desempeño</option>
        <option value="20">+20 pts — Excelente trabajo</option>
        <option value="30">+30 pts — Logro destacado</option>
        <option value="50">+50 pts — Rendimiento excepcional</option>

// HELPERS
// ══════════════════════════════════════════
function gP(id){ return S.proyectos.find(function(p){return p.id===id;}); }
function gM(id){ return S.team.find(function(t){return t.id===id;}); }
function inits(n){ return n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0].toUpperCase();}).join(''); }
function today(){ return new Date().toISOString().split('T')[0]; }
function dL(d){
  if(!d) return '—';
  try{ var p=d.split('-'); var ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return p[2]+' '+ms[parseInt(p[1])-1]+' '+p[0]; }catch(e){return d;}
}

function tareaEnSemana(t, sem){
  var sems = t.semanas && t.semanas.length > 0 ? t.semanas : [t.semana];
  return sems.indexOf(sem) !== -1;
}

function ptsFromTarea(t){
  if(t.estado !== 'Completado') return 0;
  var base = COMP_PTS[t.complejidad || 'intermedia'] || 10;
  var bonus = 0;
  if(t.prioridad === 'Alta' && t.deadline && t.deadline >= today()) bonus += 5;
  return base + bonus;
}

function getPts(pid){
  var m = gM(pid);
  if(m && m.esGerente) return null;
  var total = S.tareas.filter(function(t){return t.asignadoA===pid && t.estado==='Completado';})
    .reduce(function(sum,t){return sum+ptsFromTarea(t);},0);
  var bonuses = (S.bonificaciones||[]).filter(function(b){return b.personaId===pid;})
    .reduce(function(sum,b){return sum+b.puntos;},0);
  return total + bonuses;
}

function getStars(p){
  if(p===null) return -1;
  return p>=80?5:p>=50?4:p>=30?3:p>=15?2:p>=5?1:0;
}

function starsHtml(s){
  if(s===-1) return '<span class="ger-badge">EVALUADOR</span>';
  var h='';
  for(var i=1;i<=5;i++) h+='<span class="star '+(i<=s?'on':'off')+'">★</span>';
  return h;
}

function bdg(l,c,b){ return '<span class="bdg" style="background:'+(b||c+'18')+';color:'+c+';border:1px solid '+c+'28">'+l+'</span>'; }
function avEl(ini,sz,col){ return '<div class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.33)+'px;background:'+col+'">'+ini+'</div>'; }
function barEl(v,col,h){ return '<div class="bw" style="height:'+(h||8)+'px"><div class="bf" style="width:'+Math.min(v,100)+'%;background:'+col+'"></div></div>'; }

function autoProgress(proyId){
  var all = S.tareas.filter(function(t){return t.proyectoId===proyId;});
  if(!all.length) return null;
  var total = all.reduce(function(sum,t){
    var av = t.avance!=null ? t.avance : (t.estado==='Completado'?100:t.estado==='En Progreso'?50:0);
    return sum+av;
  },0);
  return Math.round(total/all.length);
}

function toast(msg,col){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.background=col||'#059669'; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2400);
}

function exportData(){
  var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='panel-ingenieria-'+today()+'.json'; a.click();
  toast('✓ Datos exportados');
}
function importData(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{ var d=JSON.parse(ev.target.result); if(!d.team||!d.proyectos) throw new Error(); S=d; saveState(); render(); toast('✓ Datos importados'); }
    catch(err){ alert('Archivo no válido.'); }
  };
  r.readAsText(f); e.target.value='';
}

// ══════════════════════════════════════════
// ALERTAS
// ══════════════════════════════════════════
function checkAlertas(){
  var bar=document.getElementById('abar'), dot=document.getElementById('aDot'), td=today(), alerts=[];
  S.tareas.forEach(function(t){
    if(t.estado==='Bloqueado') alerts.push('⚠ Bloqueada: "'+t.titulo+'"');
    else if(t.deadline&&t.deadline<td&&t.estado!=='Completado') alerts.push('🔴 Vencida: "'+t.titulo+'" ('+dL(t.deadline)+')');
    else if(t.deadline&&t.deadline===td&&t.estado!=='Completado') alerts.push('🟡 Vence hoy: "'+t.titulo+'"');
  });
  if(alerts.length){
    bar.innerHTML='<span style="color:var(--red);font-family:var(--mono);font-size:10px;font-weight:700;flex-shrink:0">🚨 '+alerts.length+' ALERTA'+(alerts.length>1?'S':'')+'</span>'
      +alerts.map(function(a){return '<div class="aitem">'+a+'</div>';}).join('');
    bar.classList.add('show'); if(dot) dot.classList.add('show');
  } else { bar.classList.remove('show'); if(dot) dot.classList.remove('show'); }
}

function renderWTabs(){
  document.getElementById('wtabs').innerHTML=S.semanas.map(function(s){
    return '<button class="wt '+(s===S.semanaActiva?'active':'')+'" onclick="setSem(\''+s+'\')">'+s+'</button>';
  }).join('')+'<button class="wt np" onclick="om(\'mSem\')" title="Gestionar semanas">⚙</button>';
}
function setSem(s){ S.semanaActiva=s; saveState(); renderWTabs(); render(); }

function sv(v){
  vista=v;
  var keys=['dashboard','proyectos','tareas','personal','graficas'];
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('active',keys[i]===v);});
  document.getElementById('main').style.display='block';
  document.getElementById('rCont').style.display='none';
  render();
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render(){
  checkAlertas();
  var m=document.getElementById('main');
  if(vista==='dashboard') m.innerHTML=rDash();
  else if(vista==='proyectos') m.innerHTML=rProy();
  else if(vista==='tareas') m.innerHTML=rTar();
  else if(vista==='personal') m.innerHTML=rPer();
  else if(vista==='graficas') m.innerHTML=rGraf();
}

// ── DASHBOARD ──
function rDash(){
  var sem=S.tareas.filter(function(t){return tareaEnSemana(t,S.semanaActiva);});
  var comp=sem.filter(function(t){return t.estado==='Completado';}).length;
  var bloq=S.tareas.filter(function(t){return t.estado==='Bloqueado';}).length;
  var activos=S.proyectos.filter(function(p){return p.estado==='En Progreso';}).length;

  var kpis=[
    {l:'Proyectos Activos',v:activos,c:'#2563EB',bg:'#EFF6FF'},
    {l:'Tareas '+S.semanaActiva,v:sem.length,c:'#D97706',bg:'#FFFBEB'},
    {l:'Completadas',v:comp,c:'#059669',bg:'#ECFDF5'},
    {l:'Bloqueadas',v:bloq,c:'#DC2626',bg:'#FEF2F2'},
  ].map(function(k){
    return '<div class="card kpi" style="background:'+k.bg+';border-color:'+k.c+'20">'
      +'<div class="kpi-v" style="color:'+k.c+'">'+k.v+'</div>'
      +'<div class="kpi-l" style="color:'+k.c+'99">'+k.l+'</div></div>';
  }).join('');

  var prows=S.proyectos.length ? S.proyectos.map(function(p){
    var ap=autoProgress(p.id), prog=ap!==null?ap:p.progreso;
    var pc=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    var mems=[].concat.apply([],[...new Set(S.tareas.filter(function(t){return t.proyectoId===p.id;}).map(function(t){return t.asignadoA;}))].map(function(id){var m=gM(id);return m?avEl(m.avatar,22,m.color):''}));
    return '<div class="card mb12">'
      +'<div class="row mb8" style="justify-content:space-between">'
      +'<div><div class="bo" style="font-size:13px">'+p.nombre+'</div><div class="mu xs mono">'+( p.cliente||'')+'</div></div>'
      +'<div class="row">'+bdg(p.prioridad,PC[p.prioridad],PB[p.prioridad])+bdg(p.estado,EC[p.estado],EB[p.estado])+'<span style="color:'+pc+';font-family:var(--mono);font-weight:800;font-size:16px">'+prog+'%</span></div>'
      +'</div>'+barEl(prog,pc,9)
      +'<div class="row" style="justify-content:space-between;margin-top:7px">'
      +'<div class="row" style="gap:3px">'+mems.join('')+'</div>'
      +'<span class="xs mu mono">Entrega: '+dL(p.fechaFin)+'</span></div></div>';
  }).join('') : '<div class="card" style="text-align:center;padding:30px;color:var(--muted)">Sin proyectos. <button class="bp np" style="margin-left:10px" onclick="sv(\'proyectos\')">Crear proyecto</button></div>';

  var teamH=S.team.map(function(m){
    var p=getPts(m.id), s=getStars(p);
    var tot=S.tareas.filter(function(t){return t.asignadoA===m.id;}).length;
    var c=S.tareas.filter(function(t){return t.asignadoA===m.id&&t.estado==='Completado';}).length;
    var ptsHtml=m.esGerente ? '<span class="ger-badge">EVALUADOR</span>' : starsHtml(s)+'<span class="mu xs mono" style="margin-left:3px">'+p+' pts</span>';
    return '<div class="card">'
      +'<div class="row mb8">'+avEl(m.avatar,34,m.color)+'<div><div class="bo sm">'+m.nombre+'</div><div class="mu xs mono">'+m.rol+'</div></div></div>'
      +'<div class="row mb6">'+ptsHtml+'</div>'
      +'<div class="mu xs mono mb6">'+c+'/'+tot+' completadas</div>'
      +barEl(tot>0?(c/tot)*100:0,m.color,5)+'</div>';
  }).join('');

  return '<div class="ey">RESUMEN EJECUTIVO</div><div class="st">Panel de Control — '+S.semanaActiva+'</div>'
    +'<div class="g4 mb20">'+kpis+'</div>'
    +'<div class="ey mb8">AVANCE DE PROYECTOS</div><div class="mb20">'+prows+'</div>'
    +'<div class="ey mb8">EQUIPO</div><div class="g2">'+teamH+'</div>';
}

// ── PROYECTOS ──
function rProy(){
  var rows=S.proyectos.map(function(p){
    var ap=autoProgress(p.id), prog=ap!==null?ap:p.progreso;
    var pc=prog>70?'#059669':'#D97706';
    var tP=S.tareas.filter(function(t){return t.proyectoId===p.id;});
    var comp=tP.filter(function(t){return t.estado==='Completado';}).length;
    var mems=[...new Set(tP.map(function(t){return t.asignadoA;}))].map(function(id){var m=gM(id);return m?'<span class="row" style="gap:4px;font-size:10px;color:var(--text3);font-family:var(--mono)">'+avEl(m.avatar,20,m.color)+m.nombre+'</span>':''}).join('');
    return '<div class="card mb12">'
      +'<div class="row mb10" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">'
      +'<div style="flex:1;min-width:180px">'
      +'<div class="row mb6">'+bdg(p.estado,EC[p.estado],EB[p.estado])+bdg(p.prioridad,PC[p.prioridad],PB[p.prioridad])+'</div>'
      +'<div class="bo" style="font-size:14px;margin-bottom:2px">'+p.nombre+'</div>'
      +(p.cliente?'<div class="mu xs mono">Cliente: '+p.cliente+'</div>':'')
      +(p.desc?'<div class="xs mu" style="margin-top:5px">'+p.desc+'</div>':'')
      +'</div>'
      +'<div class="row np"><button class="bs" onclick="oMP('+p.id+')">✏ Editar</button><button class="bd" onclick="delProy('+p.id+')">✕</button></div>'
      +'</div>'
      +'<div class="row mb5" style="justify-content:space-between">'
      +'<span class="xs mono mu">Avance'+(ap!==null?' (auto)':'')+'</span>'
      +'<span style="color:'+pc+';font-family:var(--mono);font-weight:800">'+prog+'%</span></div>'
      +barEl(prog,pc,11)
      +'<div class="row" style="gap:14px;margin-top:10px;flex-wrap:wrap">'
      +'<span class="xs mu mono">📅 '+dL(p.fechaInicio)+' → '+dL(p.fechaFin)+'</span>'
      +'<span class="xs mono" style="color:#059669">✓ '+comp+'/'+tP.length+' tareas</span></div>'
      +(mems?'<div class="row" style="gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border2);flex-wrap:wrap">'+mems+'</div>':'')
      +'</div>';
  }).join('');

  return '<div class="row mb20" style="justify-content:space-between">'
    +'<div><div class="ey">GESTIÓN</div><div class="st" style="margin-bottom:0">Proyectos</div></div>'
    +'<button class="bp np" onclick="oMP()">+ Nuevo Proyecto</button></div>'
    +(rows||'<div class="card" style="text-align:center;padding:30px;color:var(--muted)">Sin proyectos. Crea el primero.</div>');
}

// ── TAREAS ──
function rTar(){
  var td=today();
  var sem=S.tareas.filter(function(t){return tareaEnSemana(t,S.semanaActiva);});
  var html='<div class="row mb20" style="justify-content:space-between">'
    +'<div><div class="ey">SEGUIMIENTO · '+S.semanaActiva+'</div><div class="st" style="margin-bottom:0">Tareas del Equipo</div></div>'
    +'<button class="bp np" onclick="oMT()">+ Nueva Tarea</button></div>';

  var hayT=false;
  S.team.forEach(function(m){
    var tm=sem.filter(function(t){return t.asignadoA===m.id;});
    if(!tm.length) return;
    hayT=true;
    var rows=tm.map(function(t){
      var proy=gP(t.proyectoId);
      var venc=t.deadline&&t.deadline<td&&t.estado!=='Completado';
      var av=t.avance!=null?t.avance:(t.estado==='Completado'?100:t.estado==='En Progreso'?50:0);
      var avCol=av>=100?'#059669':av>=50?'#D97706':'#2563EB';
      var sems=(t.semanas&&t.semanas.length>1?t.semanas:[t.semana]).map(function(s){
        return '<span style="background:var(--blue-bg);color:#1E3A6E;border:1px solid #BFDBFE;border-radius:4px;padding:1px 6px;font-size:9px;font-family:var(--mono)">'+s+'</span>';
      }).join('');
      var cxCol={basica:'#059669',intermedia:'#D97706',alta:'#DC2626',critica:'#7C3AED'};
      var cxBg={basica:'#ECFDF5',intermedia:'#FFFBEB',alta:'#FEF2F2',critica:'#F5F3FF'};
      var opts=['Pendiente','En Progreso','Completado','Bloqueado'].map(function(e){return '<option value="'+e+'"'+(t.estado===e?' selected':'')+'>'+e+'</option>';}).join('');
      return '<div class="card row mb8" style="flex-wrap:wrap;'+(venc?'border-color:#FECACA;background:#FEF9F9;':'')+'">'
        +'<div style="flex:1;min-width:160px">'
        +'<div class="bo sm mb4">'+t.titulo+(venc?' <span style="color:var(--red);font-size:9px;font-family:var(--mono)">VENCIDA</span>':'')+'</div>'
        +'<div class="mu xs mono">'+(proy?proy.nombre:'—')+(t.deadline?' · '+dL(t.deadline):'')+'</div>'
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">'+sems+'</div>'
        +(t.complejidad?'<span style="background:'+cxBg[t.complejidad]+';color:'+cxCol[t.complejidad]+';border-radius:4px;padding:1px 7px;font-size:9px;font-family:var(--mono);font-weight:700;display:inline-block;margin-top:3px">'+COMP_LABEL[t.complejidad]+'</span>':'')
        +(t.notas?'<div class="xs mu" style="margin-top:3px;font-style:italic">'+t.notas.slice(0,80)+(t.notas.length>80?'…':'')+'</div>':'')
        +(t.comentarios&&t.comentarios.length?'<div class="xs mono" style="color:#1E3A6E;margin-top:3px">💬 '+t.comentarios.length+'</div>':'')
        +'<div style="display:flex;align-items:center;gap:6px;margin-top:5px">'
        +'<div class="bw" style="height:6px;flex:1"><div class="bf" style="width:'+av+'%;background:'+avCol+'"></div></div>'
        +'<span class="xs mono" style="color:var(--muted2);min-width:28px">'+av+'%</span></div>'
        +'</div>'
        +'<div class="row np" style="gap:5px;flex-wrap:wrap">'
        +bdg(t.prioridad,PC[t.prioridad],PB[t.prioridad])
        +'<select class="ss" onchange="changeEst('+t.id+',this.value)" style="background:'+EB[t.estado]+';border-color:'+EC[t.estado]+'50;color:'+EC[t.estado]+'">'+opts+'</select>'
        +'<button class="bs" onclick="oMT('+t.id+')">✏</button>'
        +'<button class="bs" onclick="oDet('+t.id+')">👁</button>'
        +'<button class="bd" onclick="delTar('+t.id+')">✕</button>'
        +'</div></div>';
    }).join('');
    html+='<div class="mb16"><div class="row mb8">'+avEl(m.avatar,28,m.color)+'<span class="bo sm">'+m.nombre+'</span><span class="mu xs mono">— '+m.rol+'</span></div>'+rows+'</div>';
  });

  if(!hayT) html+='<div class="card" style="text-align:center;padding:36px;color:var(--muted)">Sin tareas para '+S.semanaActiva+'.<br><button class="bp np" style="margin-top:12px" onclick="oMT()">Crear tarea</button></div>';
  return html;
}

// ── PERSONAL ──
function rPer(){
  var cards=S.team.map(function(m){
    var p=getPts(m.id), s=getStars(p);
    var todas=S.tareas.filter(function(t){return t.asignadoA===m.id;});
    var comp=todas.filter(function(t){return t.estado==='Completado';}).length;
    var enP=todas.filter(function(t){return t.estado==='En Progreso';}).length;
    var pend=todas.filter(function(t){return t.estado==='Pendiente';}).length;
    var bloq=todas.filter(function(t){return t.estado==='Bloqueado';}).length;
    var pct=todas.length>0?Math.round((comp/todas.length)*100):0;
    var tags=todas.slice(0,4).map(function(t){return '<span style="background:'+EB[t.estado]+';border:1px solid '+EC[t.estado]+'28;border-radius:5px;padding:2px 7px;font-size:9px;color:'+EC[t.estado]+';font-family:var(--mono)">'+t.titulo.slice(0,24)+(t.titulo.length>24?'…':'')+'</span>';}).join('');
    var rec=(!m.esGerente&&s>=4)?'<div class="rb"><span>🏆</span><span>'+(s===5?'Rendimiento Excepcional — Candidato a reconocimiento':'Alto Desempeño — Excelente contribución')+'</span></div>':'';
    var bonos=(S.bonificaciones||[]).filter(function(b){return b.personaId===m.id;});
    var bonoHtml=bonos.length?'<div style="margin-top:10px;border-top:1px solid var(--border2);padding-top:10px"><div class="xs mu mono mb6">BONIFICACIONES RECIBIDAS</div>'
      +bonos.map(function(b){return '<div class="bono-item"><div class="bono-pts">+'+b.puntos+' pts — '+dL(b.fecha)+'</div><div class="bono-nota">'+b.nota+'</div></div>';}).join('')+'</div>':'';

    var cumplHtml=m.esGerente
      ?'<div style="min-width:80px;text-align:center"><div class="xs mono mb4" style="color:var(--muted2)">ROL</div><div style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--amber);padding:4px">EVALUADOR</div></div>'
      :'<div style="min-width:80px;text-align:center"><div class="xs mono mb4" style="color:var(--muted2)">CUMPLIMIENTO</div><div style="font-size:26px;font-weight:900;font-family:var(--mono);color:'+(pct>0?'#2563EB':'var(--muted3)')+'">'+pct+'%</div>'+barEl(pct,'#2563EB',5)+'</div>';

    var ptsHtml=m.esGerente?'<span class="ger-badge">EVALUADOR</span>':starsHtml(s)+(p!==null?'<span class="mono bo" style="color:#D97706;margin-left:6px">'+p+' pts</span>':'');

    return '<div class="card mb12">'
      +'<div class="row mb14" style="align-items:flex-start;flex-wrap:wrap;gap:12px">'
      +'<div class="row">'+avEl(m.avatar,46,m.color)
      +'<div><div class="bo" style="font-size:15px">'+m.nombre+'</div><div class="mu xs mono mb6">'+m.rol+'</div>'
      +'<div class="row" style="gap:5px">'+bdg(m.nivel,NC[m.nivel]||'#7C3AED')
      +'<button class="bs np" onclick="oMPer('+m.id+')" style="font-size:9px;padding:2px 7px">✏</button>'
      +(m.id!==1?'<button class="bd np" onclick="delPer('+m.id+')" style="font-size:9px;padding:2px 7px">✕</button>':'')
      +'</div></div></div>'
      +'<div style="flex:1;min-width:190px">'
      +'<div class="row mb8">'+ptsHtml+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'
      +[['✓',comp,'#059669','#ECFDF5'],['▶',enP,'#D97706','#FFFBEB'],['⏸',pend,'#6B7280','#F9FAFB'],['⚠',bloq,'#DC2626','#FEF2F2']].map(function(x){
        return '<div style="background:'+x[3]+';border:1px solid '+x[2]+'18;border-radius:7px;padding:7px;text-align:center"><div style="color:'+x[2]+';font-weight:900;font-size:18px;font-family:var(--mono)">'+x[1]+'</div><div class="xs mono" style="color:'+x[2]+'99">'+x[0]+'</div></div>';
      }).join('')+'</div></div>'+cumplHtml+'</div>'
      +'<div class="div2"></div><div class="xs mu mono mb6">TAREAS RECIENTES</div>'
      +'<div style="display:flex;gap:5px;flex-wrap:wrap">'+tags+(todas.length>4?'<span class="xs mu mono">+'+( todas.length-4)+' más</span>':'')+'</div>'
      +rec+bonoHtml+'</div>';
  }).join('');

  return '<div class="row mb20" style="justify-content:space-between">'
    +'<div><div class="ey">RENDIMIENTO Y EQUIPO</div><div class="st" style="margin-bottom:0">Personal de Ingeniería</div></div>'
    +'<div class="row"><button class="bp2 np" onclick="oBono()">🏆 Otorgar Bonificación</button><button class="bp np" onclick="oMPer()">+ Nuevo Miembro</button></div></div>'
    +cards;
}

// ── GRÁFICAS ──
function rGraf(){
  var proyB=S.proyectos.map(function(p){
    var ap=autoProgress(p.id),prog=ap!==null?ap:p.progreso,c=prog>70?'#059669':prog>40?'#D97706':'#DC2626';
    return '<div class="cbh"><div class="cl">'+p.nombre.slice(0,20)+'</div><div class="ct"><div class="cf" style="width:'+prog+'%;background:'+c+'"><span class="cv">'+prog+'%</span></div></div></div>';
  }).join('') || '<div class="xs mu mono">Sin proyectos.</div>';

  var perB=S.team.filter(function(m){return !m.esGerente;}).map(function(m){
    var p=getPts(m.id)||0, pct=Math.min(Math.round((p/80)*100),100);
    return '<div class="cbh"><div class="cl">'+m.nombre.split(' ')[0]+'</div><div class="ct"><div class="cf" style="width:'+pct+'%;background:'+m.color+'"><span class="cv">'+p+' pts</span></div></div></div>';
  }).join('');

  var totT=S.tareas.length||1;
  var estB=['Completado','En Progreso','Pendiente','Bloqueado'].map(function(e){
    var n=S.tareas.filter(function(t){return t.estado===e;}).length, pct=Math.round((n/totT)*100);
    return '<div class="cbh"><div class="cl">'+e+'</div><div class="ct"><div class="cf" style="width:'+pct+'%;background:'+EC[e]+'"><span class="cv">'+n+' ('+pct+'%)</span></div></div></div>';
  }).join('');

  var semB=S.semanas.map(function(s){
    var n=S.tareas.filter(function(t){return tareaEnSemana(t,s);}).length;
    var c=S.tareas.filter(function(t){return tareaEnSemana(t,s)&&t.estado==='Completado';}).length;
    var pct=n>0?Math.round((c/n)*100):0;
    return '<div class="cbh"><div class="cl">'+s+'</div><div class="ct"><div class="cf" style="width:'+pct+'%;background:#059669"><span class="cv">'+c+'/'+n+'</span></div></div></div>';
  }).join('');

  var cxB=['basica','intermedia','alta','critica'].map(function(cx){
    var n=S.tareas.filter(function(t){return t.complejidad===cx;}).length, pct=Math.round((n/totT)*100);
    var cols={basica:'#059669',intermedia:'#D97706',alta:'#DC2626',critica:'#7C3AED'};
    return '<div class="cbh"><div class="cl">'+COMP_LABEL[cx]+'</div><div class="ct"><div class="cf" style="width:'+pct+'%;background:'+cols[cx]+'"><span class="cv">'+n+'</span></div></div></div>';
  }).join('');

  return '<div class="ey">ANÁLISIS</div><div class="st">Gráficas de Progreso</div>'
    +'<div class="g3">'
    +'<div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📊 Avance por Proyecto</div>'+proyB+'</div>'
    +'<div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">⭐ Puntos por Persona</div>'+perB+'</div>'
    +'<div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📋 Tareas por Estado</div>'+estB+'</div>'
    +'<div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">📅 Completadas por Semana</div>'+semB+'</div>'
    +'<div class="card"><div class="bo mb12 sm" style="color:#1E3A6E">🔧 Tareas por Complejidad</div>'+cxB+'</div>'
    +'</div>';
}

// ══════════════════════════════════════════
// REPORT
// ══════════════════════════════════════════
function openReport(){
  document.getElementById('main').style.display='none';
  document.getElementById('rCont').style.display='block';
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});
  buildReport();
}
function closeReport(){
  document.getElementById('main').style.display='block';
  document.getElementById('rCont').style.display='none';
  var keys=['dashboard','proyectos','tareas','personal','graficas'];
  document.querySelectorAll('.nb').forEach(function(b,i){b.classList.toggle('active',keys[i]===vista);});
}
function buildReport(){
  var sem=S.semanaActiva;
  var tareasSem=S.tareas.filter(function(t){return tareaEnSemana(t,sem);});
  var comp=tareasSem.filter(function(t){return t.estado==='Completado';}).length;
  var pend=tareasSem.filter(function(t){return t.estado==='Pendiente'||t.estado==='Bloqueado';}).length;
  var activos=S.proyectos.filter(function(p){return p.estado==='En Progreso';}).length;
  var fechaStr=new Date().toLocaleDateString('es-DO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var logoSrc=document.getElementById('logoImg').src||'';
  var PRIO_ORD={Alta:0,Media:1,Baja:2};

  var kpis=[
    {l:'Proyectos Activos',v:activos},{l:'Tareas Semana',v:tareasSem.length},{l:'Completadas',v:comp},{l:'Pendientes/Bloq.',v:pend}
  ].map(function(k){return '<div class="r-kpi"><div class="r-kpi-v">'+k.v+'</div><div class="r-kpi-l">'+k.l+'</div></div>';}).join('');

  var tableRows=S.team.map(function(m,i){
    var tm=tareasSem.filter(function(t){return t.asignadoA===m.id;});
    var c=tm.filter(function(t){return t.estado==='Completado';}).length;
    var ep=tm.filter(function(t){return t.estado==='En Progreso';}).length;

function shareWA(){
  var sem=S.semanaActiva;
  var tareasSem=S.tareas.filter(function(t){return tareaEnSemana(t,sem);});
  var PRIO_ORD={Alta:0,Media:1,Baja:2};
  var comp=tareasSem.filter(function(t){return t.estado==='Completado';}).length;
  var bloq=tareasSem.filter(function(t){return t.estado==='Bloqueado';}).length;
  var nl=String.fromCharCode(10);
  var msg='*ELMUFDI CONSTRUCCIONES*'+nl+'*Reporte Semanal - '+sem+'*'+nl;
  msg+='_'+new Date().toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'})+'_'+nl+nl;
  msg+='Resumen: '+tareasSem.length+' tareas | '+comp+' completadas | '+bloq+' bloqueadas'+nl+nl;
  S.team.forEach(function(m){
    var tm=tareasSem.filter(function(t){return t.asignadoA===m.id;}).sort(function(a,b){return PRIO_ORD[a.prioridad]-PRIO_ORD[b.prioridad];});
    if(!tm.length) return;
    msg+='*'+m.nombre+'*'+nl;
    tm.forEach(function(t){
      var icon={Alta:'🔴',Media:'🟡',Baja:'🟢'}[t.prioridad]||'•';
      var est={Completado:'✅','En Progreso':'🔄',Pendiente:'⏸',Bloqueado:'🚫'}[t.estado]||'•';
      msg+=icon+' '+est+' '+t.titulo+nl;
    });
    msg+=nl;
  });
  msg+='_Panel de Ingeniería - Elmufdi Construcciones_';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function oMT(id){
  _eTid=id||null;
  var t=id?S.tareas.find(function(x){return x.id===id;}):null;
  document.getElementById('mtT').textContent=id?'Editar Tarea':'Nueva Tarea';
  document.getElementById('tp_p').innerHTML=S.proyectos.map(function(p){return '<option value="'+p.id+'"'+(t&&t.proyectoId===p.id?' selected':'')+'>'+p.nombre+'</option>';}).join('');
  document.getElementById('tp_a').innerHTML=S.team.map(function(m){return '<option value="'+m.id+'"'+(t&&t.asignadoA===m.id?' selected':'')+'>'+m.nombre+'</option>';}).join('');
  var semsActuales=t?(t.semanas&&t.semanas.length?t.semanas:[t.semana]):[S.semanaActiva];
  document.getElementById('tp_sc').innerHTML=S.semanas.map(function(s){
    var chk=semsActuales.indexOf(s)!==-1;
    var isAct=s===S.semanaActiva;
    return '<label class="sem-check'+(chk?' active':'')+'" onclick="toggleSemCheck(this)">'
      +'<input type="checkbox" value="'+s+'"'+(chk?' checked':'')+' style="display:none">'+s+(isAct?' ●':'')+'</label>';
  }).join('');
  document.getElementById('tp_t').value=t?t.titulo:'';
  document.getElementById('tp_dl').value=t?t.deadline||'':'';
  document.getElementById('tp_e').value=t?t.estado:'Pendiente';
  document.getElementById('tp_pr').value=t?t.prioridad:'Alta';
  document.getElementById('tp_cx').value=t?t.complejidad||'intermedia':'intermedia';
  var av=t?(t.avance!=null?t.avance:0):0; document.getElementById('tp_av').value=av; document.getElementById('tp_av_v').textContent=av;
  document.getElementById('tp_n').value=t?t.notas||'':'';
  om('mTar');
}
function toggleSemCheck(lbl){
  var cb=lbl.querySelector('input');
  cb.checked=!cb.checked;
  lbl.classList.toggle('active',cb.checked);
}
function saveTar(){
  var semanas=Array.from(document.querySelectorAll('#tp_sc input:checked')).map(function(cb){return cb.value;});
  if(!semanas.length) semanas=[S.semanaActiva];
  var estadoVal=document.getElementById('tp_e').value;
  var avanceVal=parseInt(document.getElementById('tp_av').value)||0;
  if(estadoVal==='Completado') avanceVal=100;
  var d={proyectoId:parseInt(document.getElementById('tp_p').value)||0,titulo:document.getElementById('tp_t').value.trim(),asignadoA:parseInt(document.getElementById('tp_a').value)||0,semanas:semanas,semana:semanas[0],deadline:document.getElementById('tp_dl').value,estado:estadoVal,prioridad:document.getElementById('tp_pr').value,complejidad:document.getElementById('tp_cx').value||'intermedia',avance:avanceVal,notas:document.getElementById('tp_n').value.trim()};
  if(!d.titulo){alert('El título es requerido.');return;}
  if(_eTid){
    var old=S.tareas.find(function(t){return t.id===_eTid;});
    var hist=(old.historial||[]).slice();
    if(old.estado!==d.estado) hist.push({estado:d.estado,fecha:today(),autor:'Alejandro Castro',semana:S.semanaActiva});
    S.tareas=S.tareas.map(function(t){return t.id===_eTid?Object.assign({},t,d,{historial:hist}):t;});
    toast('✓ Tarea actualizada');
  } else {
    S.tareas.push(Object.assign({id:Date.now()},d,{comentarios:[],historial:[{estado:d.estado,fecha:today(),autor:'Alejandro Castro',semana:S.semanaActiva}]}));
    toast('✓ Tarea creada en: '+semanas.join(', '));
  }
  saveState();cm('mTar');render();
}
function changeEst(id,estado){
  S.tareas=S.tareas.map(function(t){
    if(t.id!==id) return t;
    var hist=(t.historial||[]).concat([{estado:estado,fecha:today(),autor:'Alejandro Castro',semana:S.semanaActiva}]);
    var av=t.avance!=null?t.avance:0;
    if(estado==='Completado') av=100;
    return Object.assign({},t,{estado:estado,avance:av,historial:hist});
  });
  saveState();toast('✓ Estado actualizado');render();
}
function delTar(id){
  var t=S.tareas.find(function(x){return x.id===id;});
  if(!confirm('¿Eliminar tarea "'+t.titulo+'"?')) return;
  S.tareas=S.tareas.filter(function(x){return x.id!==id;});
  saveState();render();toast('✓ Eliminada','#DC2626');
}

      : '<button class="bs" style="font-size:10px" onclick="activarSem('+i+')">Activar</button>';
    var delBtn = S.semanas.length>1
      ? '<button class="bd" style="font-size:10px" onclick="delSem('+i+')">✕</button>'
      : '';
    html += '<div class="row mb8" style="justify-content:space-between"><span class="sm mono">'+s+'</span><div class="row" style="gap:5px">'+activarBtn+delBtn+'</div></div>';
  });
  document.getElementById('semList').innerHTML = html;
}
function activarSem(i){ setSem(S.semanas[i]); renderSemList(); }
function addSem(){
  var v=document.getElementById('sem_n').value.trim();
  if(!v){return;} if(S.semanas.indexOf(v)!==-1){alert('Ya existe.');return;}
  S.semanas.push(v); document.getElementById('sem_n').value='';
  saveState();renderWTabs();renderSemList();toast('✓ Semana agregada');
}
function delSem(i){
  if(S.semanaActiva===S.semanas[i]){alert('No puedes eliminar la semana activa.');return;}
  if(!confirm('¿Eliminar "'+S.semanas[i]+'"?')) return;
  S.semanas.splice(i,1); saveState();renderWTabs();renderSemList();toast('✓ Eliminada','#DC2626');
}

function om(id){ document.getElementById(id).classList.add('open'); if(id==='mSem') renderSemList(); }
function cm(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.mo').forEach(function(el){ el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('open');}); });
document.addEventListener('keydown',function(e){if(e.key==='Escape') document.querySelectorAll('.mo.open').forEach(function(m){m.classList.remove('open');});});

renderWTabs();
render();
</script>
</body>
</html>
